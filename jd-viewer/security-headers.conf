# 뷰어 보안 헤더 — 이 파일 하나가 원본이다.
#   · nginx(도커 배포): nginx.conf 의 server 와 add_header 를 쓰는 location 마다 include 한다.
#     nginx 는 location 에 add_header 가 하나라도 있으면 server 의 add_header 를 물려받지 않는다.
#   · bin/serve_viewer.py(맥 상시 서빙, ngrok 이 외부에 여는 것): 시작할 때 이 파일을 읽어 같은 헤더를 붙인다.
# 한 줄에 헤더 하나, `add_header 이름 "값" always;` 꼴을 지킨다(serve_viewer.py 가 이 꼴만 읽는다).
#
# CSP 가 허용하는 바깥 출처와 이유:
#   img-src https:       회사 로고(캐치·점핏·구글 파비콘)·블로그 썸네일·devicon 아이콘 — 출처가 많아 https 전체
#   cdn.jsdelivr.net     마인드맵(markmap)이 KaTeX·Prism 스크립트·스타일·글꼴을 실행 중에 불러온다
#   youtube·vimeo        기술 블로그 본문의 영상 임베드(iframe)
# 'unsafe-inline' 은 style 에만 — React·d3·mermaid 가 style 속성을 쓴다. 스크립트에는 없다
# (빌드 HTML 에 실행되는 인라인 스크립트가 없다. JSON-LD 는 실행되지 않는 데이터 블록이다).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: blob: https:; font-src 'self' data: https://cdn.jsdelivr.net; connect-src 'self'; frame-src https://www.youtube.com https://www.youtube-nocookie.com https://player.vimeo.com; media-src 'self' https:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# HTTPS(ngrok)로 들어왔을 때만 브라우저가 따른다 — 평문 HTTP 응답의 이 헤더는 무시된다. 하위 도메인은 묶지 않는다.
add_header Strict-Transport-Security "max-age=31536000" always;
