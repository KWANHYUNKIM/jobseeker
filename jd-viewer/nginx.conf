server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # 데이터 JSON 은 live 볼륨(/data = 호스트 jd-viewer/public)에서 서빙한다.
  # → 자동 크롤이 public/*.json 을 갱신하면 재빌드 없이 즉시 최신 숫자가 보임.
  location ~* \.json$ {
    root /data;
    try_files $uri =404;
    add_header Cache-Control "no-cache, must-revalidate";
    types { application/json json; }
    default_type application/json;
  }

  # 정적 자산: 해시 파일명이라 장기 캐시
  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  # SPA 라우팅 — 없는 경로는 index.html 로
  location / {
    try_files $uri $uri/ /index.html;
  }

  gzip on;
  gzip_types application/javascript application/json text/css image/svg+xml;
  gzip_min_length 1024;
}
