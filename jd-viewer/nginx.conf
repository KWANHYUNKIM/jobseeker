server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # 데이터 JSON 은 live 볼륨(/data = 호스트 jd-viewer/public)에서 서빙한다.
  # → 자동 크롤이 public/*.json 을 갱신하면 재빌드 없이 즉시 최신 숫자가 보임.
  location ~* \.json$ {
    root /data;
    try_files $uri =404;
    add_header Cache-Control "no-cache, must-revalidate";
    types { application/json json; }
    default_type application/json;
  }

  # 하이브리드 검색 API — 호스트 네이티브로 도는 semantic.server(8771)로 넘긴다.
  # 컨테이너에 넣지 않는 이유: 질의마다 Ollama 임베딩과 semantic.db 가 필요한데
  # 둘 다 호스트에 있다. 뷰어와 같은 오리진으로 묶어 CORS 를 없앤다.
  #
  # 서버가 없으면(검색 미설치) 502 가 나고, 뷰어는 /api/health 실패를 보고
  # 의미 검색 UI 자체를 감춘다 — 정적 배포만으로도 나머지는 그대로 동작한다.
  location /api/ {
    proxy_pass http://host.docker.internal:8771;
    proxy_set_header Host $host;
    # 질의 임베딩이 걸려 일반 정적 응답보다 느리다. 그래도 무한정 기다리진 않는다.
    proxy_read_timeout 30s;
    proxy_connect_timeout 3s;
    # 서버가 내려가 있을 때 nginx 가 통째로 죽지 않도록 조용히 502 를 돌려준다.
    proxy_intercept_errors off;
  }

  # 정적 자산: 해시 파일명이라 장기 캐시
  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  # SPA 라우팅 — 없는 경로는 index.html 로
  location / {
    try_files $uri $uri/ /index.html;
  }

  gzip on;
  gzip_types application/javascript application/json text/css image/svg+xml;
  gzip_min_length 1024;
}
