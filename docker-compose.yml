# JD 뷰어 서빙 — nginx 가 빌드된 SPA + live 데이터(public/*.json)를 제공.
# 데이터 볼륨이 read-only 라 자동 크롤 갱신이 재빌드 없이 즉시 반영된다.
#
# 실행:  docker compose up -d --build      → http://localhost:8080
# 공개:  ngrok http 8080                   → 공개 URL (ngrok 계정/authtoken 필요)
# 종료:  docker compose down
services:
  viewer:
    build:
      context: ./jd-viewer
      dockerfile: Dockerfile
    image: jobseeker-viewer
    container_name: jobseeker-viewer
    ports:
      - "8080:80"
    volumes:
      - ./jd-viewer/public:/data:ro
    restart: unless-stopped
