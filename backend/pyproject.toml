[project]
name = "jobseeker-backend"
version = "0.1.0"
description = "jobseeker 뷰어 API — 정본 DB(PostgreSQL)를 읽어 답한다(8771)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",   # fastapi.testclient 가 쓴다
]

[tool.pytest.ini_options]
# backend/ 가 import 루트다(`from app.features.jobs import ...`).
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "db: 정본 DB(PostgreSQL)가 떠 있어야 도는 테스트 — 없으면 건너뛴다",
    "node: node 로 뷰어 TS 원본을 직접 돌리는 대조 — node 가 없으면 건너뛴다",
]
filterwarnings = ["ignore::DeprecationWarning:starlette.*"]

[tool.setuptools.packages.find]
include = ["app*"]
