<!doctype html>
<!-- 디자인 에이전트 — 판정(④)과 릴리즈는 사람이 여기서 누른다. 읽는 것: /api/design (agent/web.py)
     누르면 바로 DB(design_verdict · design_trial.release)에 들어가고, 교훈 점수(⑤)가 다시 계산된다. -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>디자인 판정</title>
<style>
  :root { --bg:#f4f2ed; --panel:#fff; --ink:#1c1a17; --sub:#6f6a60; --line:#e2ddd2; --good:#1f7a4d; --bad:#b3261e; --accent:#9e5c12; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:'Pretendard','Malgun Gothic',sans-serif; }
  header { padding:22px 28px 10px; }
  h1 { margin:0; font-size:24px; }
  .flow { color:var(--sub); font-size:14px; margin-top:6px; line-height:1.6; }
  .flow b { color:var(--ink); }
  main { padding:6px 28px 40px; display:grid; grid-template-columns:minmax(0, 1fr); gap:18px; }
  .trial { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px 18px; }
  .t-head { display:flex; flex-wrap:wrap; gap:10px 18px; align-items:baseline; }
  .t-head h2 { margin:0; font-size:20px; }
  .t-head .meta { color:var(--sub); font-size:13px; }
  .why { display:flex; flex-wrap:wrap; gap:6px 14px; font-size:13px; color:var(--sub); margin:8px 0 4px; }
  .chip { display:inline-flex; align-items:center; gap:5px; font-family:Consolas,monospace; font-size:12px; }
  .chip i { width:13px; height:13px; border:1px solid #0002; display:inline-block; }
  .lessons-used { font-size:12px; color:var(--sub); margin:2px 0 10px; }
  .release { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:8px 0 12px; padding:10px 12px;
             background:#faf8f3; border:1px solid var(--line); border-radius:8px; }
  .release b { font-size:14px; margin-right:6px; }
  .release .state { font-size:13px; font-weight:700; }
  button { font:inherit; font-size:13px; border:1px solid var(--line); background:#fff; border-radius:6px; padding:6px 12px; cursor:pointer; }
  button.on.good, button.good:hover { background:var(--good); color:#fff; border-color:var(--good); }
  button.on.bad, button.bad:hover { background:var(--bad); color:#fff; border-color:var(--bad); }
  input[type=text] { font:inherit; font-size:13px; border:1px solid var(--line); border-radius:6px; padding:6px 9px; min-width:0; }
  .slides { display:flex; gap:14px; overflow-x:auto; padding-bottom:8px; }
  .s { flex:0 0 auto; width:260px; }
  .s img { width:260px; display:block; border:2px solid transparent; border-radius:4px; cursor:zoom-in; }
  .s.good img { border-color:var(--good); } .s.bad img { border-color:var(--bad); }
  .s .row { display:flex; gap:6px; margin-top:6px; align-items:center; }
  .s .row span { font-size:12px; color:var(--sub); width:24px; }
  .s input { width:100%; margin-top:5px; }
  .saved { font-size:11px; color:var(--good); height:14px; }
  .side { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px 18px; }
  .side h2 { margin:0 0 8px; font-size:18px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  td, th { text-align:left; padding:7px 6px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--sub); font-weight:600; font-size:12px; }
  td.sc { font-family:Consolas,monospace; font-weight:700; white-space:nowrap; }
  td.sc.pos { color:var(--good); } td.sc.neg { color:var(--bad); }
  td small { color:var(--sub); display:block; }
  .src { font-size:13px; color:var(--sub); line-height:1.8; }
  .lb { position:fixed; inset:0; z-index:10; background:#000c; display:flex; align-items:center; justify-content:center; }
  .lb[hidden] { display:none; }   /* display:flex 가 hidden 을 이겨서 빈 확대 창이 늘 화면을 덮었다 */
  .lb img { max-height:94vh; max-width:94vw; }
</style>
</head>
<body>
<header>
  <h1>디자인 판정</h1>
  <div class="flow"><b>① 모으기</b> 유튜브·인스타·칼럼 → <b>② 배우기</b> 교훈 → <b>③ 써 보기</b> 시안 →
    <b>④ 판정</b> 여기서 장마다 좋다/별로 + 이유, 묶음마다 올려도 됨/안 됨 → <b>⑤ 점수</b> 교훈 점수가 바뀌고 다음 시안이 달라진다.
    점수와 릴리즈는 사람만 정한다.</div>
</header>
<main id="main"></main>
<div class="lb" id="lb" hidden onclick="this.hidden=true"><img id="lbimg" alt=""></div>
<script>
const $ = (s, r = document) => r.querySelector(s);
const el = (t, c, txt) => { const n = document.createElement(t); if (c) n.className = c; if (txt != null) n.textContent = txt; return n; };
const post = (path, body) => fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
  .then(r => r.json());

async function load() {
  const d = await fetch('/api/design').then(r => r.json());
  const main = $('#main'); main.textContent = '';
  if (d.error) { main.append(el('div', 'side', d.error)); return; }
  d.trials.forEach(t => main.append(trial(t)));
  main.append(lessons(d.lessons), sources(d.sources));
}

function trial(t) {
  const box = el('section', 'trial');
  const h = el('div', 't-head');
  h.append(el('h2', null, `시안 #${t.id} · ${t.corner}`), el('span', 'meta', `${t.slides.length}장 · ${t.rendered_at.slice(0, 16).replace('T', ' ')}`));
  box.append(h);
  const dir = t.direction || {};
  const why = el('div', 'why');
  if (dir.season) why.append(el('span', null, `계절 ${dir.season.name} — ${(dir.season.moments || []).join(' · ')}`));
  if (dir.photo) why.append(el('span', null, `사진 ${dir.photo.subject} — ${dir.photo.means}`));
  Object.entries(dir.palette || {}).forEach(([k, v]) => { const c = el('span', 'chip'); const i = el('i'); i.style.background = v; c.append(i, `${k} ${v}`); why.append(c); });
  box.append(why);
  if (t.lessons.length) box.append(el('div', 'lessons-used', '적용한 교훈: ' + t.lessons.map(l => `#${l.id} ${l.rule}`).join(' / ')));

  // 릴리즈 — 올려도 되나. 사람만 정한다
  const rel = el('div', 'release');
  rel.append(el('b', null, '이 묶음, 올려도 되나?'));
  const st = el('span', 'state', t.release === null ? '아직 안 봄' : t.release ? '올려도 됨' : '안 됨');
  st.style.color = t.release === null ? 'var(--sub)' : t.release ? 'var(--good)' : 'var(--bad)';
  const note = el('input'); note.type = 'text'; note.placeholder = '메모(왜?)'; note.value = t.release_note || ''; note.style.flex = '1';
  const yes = el('button', 'good' + (t.release === true ? ' on' : ''), '올려도 됨');
  const no = el('button', 'bad' + (t.release === false ? ' on' : ''), '안 됨');
  yes.onclick = () => post('/api/design/release', { trial: t.id, ok: true, note: note.value }).then(load);
  no.onclick = () => post('/api/design/release', { trial: t.id, ok: false, note: note.value }).then(load);
  rel.append(st, yes, no, note);
  box.append(rel);

  const row = el('div', 'slides');
  t.slides.forEach(s => {
    const c = el('div', 's' + (s.verdict === 1 ? ' good' : s.verdict === -1 ? ' bad' : ''));
    const img = el('img'); img.src = s.url; img.loading = 'lazy';
    img.onclick = () => { $('#lbimg').src = s.url; $('#lb').hidden = false; };
    const reason = el('input'); reason.type = 'text'; reason.placeholder = '이유 한 줄 (다음 교훈이 된다)'; reason.value = s.reason || '';
    const saved = el('div', 'saved');
    const send = v => post('/api/design/verdict', { trial: t.id, slide: s.no, verdict: v, reason: reason.value })
      .then(() => { s.verdict = v; c.className = 's ' + (v === 1 ? 'good' : 'bad'); g.classList.toggle('on', v === 1); b.classList.toggle('on', v === -1); saved.textContent = '저장됨'; });
    const g = el('button', 'good' + (s.verdict === 1 ? ' on' : ''), '좋다');
    const b = el('button', 'bad' + (s.verdict === -1 ? ' on' : ''), '별로');
    g.onclick = () => send(1); b.onclick = () => send(-1);
    reason.onchange = () => { if (s.verdict) send(s.verdict); };
    const r = el('div', 'row'); r.append(el('span', null, String(s.no).padStart(2, '0')), g, b);
    c.append(img, r, reason, saved);
    row.append(c);
  });
  box.append(row);
  return box;
}

function lessons(ls) {
  const box = el('section', 'side');
  box.append(el('h2', null, `교훈 ${ls.length}개 — 점수 순 (점수는 판정에서만 나온다)`));
  const tb = el('table');
  tb.innerHTML = '<tr><th>점수</th><th>분야</th><th>교훈</th><th>어디서</th></tr>';
  ls.forEach(l => {
    const tr = el('tr');
    const sc = el('td', 'sc' + (l.score > 0 ? ' pos' : l.score < 0 ? ' neg' : ''), `${l.score > 0 ? '+' : ''}${l.score} · ${l.votes}표`);
    const rule = el('td'); rule.append(l.rule); if (l.how) rule.append(el('small', null, l.how));
    const ev = el('td');
    ev.append(el('small', null, l.origin === 'verdict' ? '사람의 판정' : '모은 것'));
    (l.evidence || []).slice(0, 3).forEach(e => { const a = el('a', null, e.title || e.url); a.href = e.url; a.target = '_blank'; const sm = el('small'); sm.append(a); ev.append(sm); });
    tr.append(sc, el('td', null, l.area), rule, ev);
    tb.append(tr);
  });
  box.append(tb);
  return box;
}

function sources(ss) {
  const box = el('section', 'side');
  box.append(el('h2', null, `출처 ${ss.length}곳`));
  const p = el('div', 'src');
  ss.forEach(s => { const a = el('a', null, `${s.kind} ${s.handle}`); a.href = s.url; a.target = '_blank';
    p.append(a, ` ${s.followers ? '· ' + s.followers : ''} ${s.checked_at ? '· 모음 ' + s.checked_at.slice(0, 10) : '· 아직 안 모음'}`, el('br')); });
  box.append(p);
  return box;
}
load();
</script>
</body>
</html>
