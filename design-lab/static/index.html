<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>디자인 랩 — 채용 상세페이지 레퍼런스</title>
<style>
  :root{
    --bg:#0d0e11; --panel:#15171c; --panel-2:#1c1f26; --line:#272b34;
    --fg:#e8eaf0; --fg-dim:#9aa1b1; --fg-faint:#666d7d;
    --accent:#7c9cff; --steal:#5fd39a; --drop:#e2727f;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
    font:14px/1.65 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",sans-serif;}
  a{color:var(--accent)}

  header{padding:34px 32px 22px;border-bottom:1px solid var(--line)}
  h1{margin:0;font-size:19px;letter-spacing:-.02em;font-weight:650}
  .sub{margin:7px 0 0;color:var(--fg-dim);font-size:13px;max-width:66ch}
  .meta{margin-top:14px;font-family:var(--mono);font-size:11px;color:var(--fg-faint)}

  nav{display:flex;gap:7px;flex-wrap:wrap;padding:18px 32px;border-bottom:1px solid var(--line);
    position:sticky;top:0;background:rgba(13,14,17,.94);backdrop-filter:blur(8px);z-index:5}
  nav button{background:var(--panel);border:1px solid var(--line);color:var(--fg-dim);
    padding:6px 13px;border-radius:999px;font-size:12.5px;cursor:pointer;font-family:inherit}
  nav button:hover{color:var(--fg);border-color:#39404d}
  nav button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

  main{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));
    gap:18px;padding:26px 32px 60px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:11px;
    overflow:hidden;cursor:pointer;transition:border-color .13s,transform .13s}
  .card:hover{border-color:#3d4453;transform:translateY(-2px)}
  .card img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;object-position:top left;
    background:var(--panel-2)}
  .card .body{padding:13px 14px 15px}
  .card h3{margin:0 0 5px;font-size:13.5px;font-weight:600;line-height:1.4}
  .card .who{font-family:var(--mono);font-size:11px;color:var(--fg-faint)}
  .tags{margin-top:9px;display:flex;gap:5px;flex-wrap:wrap}
  .tag{font-size:10.5px;padding:2.5px 7px;border-radius:5px;background:var(--panel-2);
    color:var(--fg-dim);border:1px solid var(--line)}

  /* 상세 서랍 */
  dialog{border:none;padding:0;background:transparent;max-width:none;max-height:none;
    width:100%;height:100%;margin:0}
  dialog::backdrop{background:rgba(0,0,0,.72)}
  .sheet{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(340px,.95fr);
    height:100%;background:var(--bg)}
  .shot{background:#000;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:14px}
  .shot img{width:100%;border-radius:8px;border:1px solid var(--line)}
  .info{overflow:auto;padding:30px 32px 60px;border-left:1px solid var(--line)}
  .info h2{margin:0 0 4px;font-size:18px;letter-spacing:-.02em}
  .info .who{font-family:var(--mono);font-size:11.5px;color:var(--fg-faint);margin-bottom:18px}
  .block{margin-top:22px}
  .block .label{font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;
    text-transform:uppercase;color:var(--fg-faint);margin-bottom:7px}
  .block p{margin:0;color:#cfd4e0}
  .block.steal .label{color:var(--steal)}
  .block.drop .label{color:var(--drop)}
  .close{position:fixed;top:16px;right:20px;background:var(--panel);border:1px solid var(--line);
    color:var(--fg);width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:15px;z-index:9}

  /* 종합 */
  section.synth{margin:0 32px 60px;padding:26px 28px;background:var(--panel);
    border:1px solid var(--line);border-radius:11px}
  section.synth h2{margin:0 0 4px;font-size:15px}
  section.synth .hint{margin:0 0 18px;color:var(--fg-dim);font-size:12.5px}
  .synth-row{display:grid;grid-template-columns:100px 1fr;gap:14px;padding:11px 0;
    border-top:1px solid var(--line)}
  .synth-row .k{font-family:var(--mono);font-size:11px;color:var(--accent);padding-top:2px}
  .synth-row .v{color:#cfd4e0}

  @media (max-width:860px){
    .sheet{grid-template-columns:1fr;grid-template-rows:auto 1fr}
    .info{border-left:none;border-top:1px solid var(--line)}
    header,nav,main,section.synth{padding-left:18px;padding-right:18px}
    section.synth{margin-left:18px;margin-right:18px}
  }
</style>
</head>
<body>
<header>
  <h1>디자인 랩 — 채용 상세페이지 레퍼런스</h1>
  <p class="sub" id="purpose"></p>
  <div class="meta" id="meta"></div>
</header>

<nav id="filters"></nav>
<main id="grid"></main>
<section class="synth" id="synth"></section>

<dialog id="sheet">
  <button class="close" onclick="document.getElementById('sheet').close()">✕</button>
  <div class="sheet">
    <div class="shot" id="sheetShot"></div>
    <div class="info" id="sheetInfo"></div>
  </div>
</dialog>

<script>
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let DATA = null, active = 'all';

fetch('/api/refs.json').then(r => r.json()).then(d => { DATA = d; render(); });

function render(){
  document.getElementById('purpose').textContent = DATA.purpose;
  document.getElementById('meta').textContent =
    `${DATA.refs.length}건 · ${DATA.source} · 수집 ${DATA.collected_at}`;

  const fams = Object.entries(DATA.families);
  document.getElementById('filters').innerHTML =
    [['all', '전체 ' + DATA.refs.length], ...fams.map(([k, label]) => {
      const n = DATA.refs.filter(r => r.family === k).length;
      return [k, `${label.split(' — ')[0]} ${n}`];
    })].map(([k, label]) =>
      `<button data-f="${k}" aria-pressed="${k === active}">${esc(label)}</button>`).join('');

  document.getElementById('filters').onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    active = b.dataset.f; render();
  };

  const shown = DATA.refs.filter(r => active === 'all' || r.family === active);
  document.getElementById('grid').innerHTML = shown.map(r => `
    <article class="card" data-id="${r.id}">
      <img loading="lazy" src="/refs/${encodeURI(r.files[0])}" alt="${esc(r.title)}">
      <div class="body">
        <h3>${esc(r.title)}</h3>
        <div class="who">@${esc(r.account)} · #${esc(r.tag)}</div>
        <div class="tags">${r.mood.map(m => `<span class="tag">${esc(m)}</span>`).join('')}</div>
      </div>
    </article>`).join('');

  document.getElementById('grid').onclick = e => {
    const c = e.target.closest('.card'); if (!c) return;
    open(DATA.refs.find(r => r.id === c.dataset.id));
  };

  const s = DATA.synthesis;
  document.getElementById('synth').innerHTML = `
    <h2>여기서 뽑은 결론</h2>
    <p class="hint">12건을 다 보고 남은 것. 새 상세페이지는 이 여섯 줄로 시작한다.</p>
    ${Object.entries(s).map(([k, v]) =>
      `<div class="synth-row"><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div></div>`).join('')}`;
}

function open(r){
  document.getElementById('sheetShot').innerHTML =
    r.files.map(f => `<img src="/refs/${encodeURI(f)}" alt="${esc(r.title)}">`).join('');
  document.getElementById('sheetInfo').innerHTML = `
    <h2>${esc(r.title)}</h2>
    <div class="who">@${esc(r.account)} · #${esc(r.tag)}${
      r.url ? ` · <a href="${esc(r.url)}" target="_blank" rel="noreferrer">원본</a>` : ''}</div>
    <div class="tags">${r.mood.map(m => `<span class="tag">${esc(m)}</span>`).join('')}</div>
    <div class="block"><div class="label">읽은 것</div><p>${esc(r.read)}</p></div>
    <div class="block steal"><div class="label">가져올 것</div><p>${esc(r.steal)}</p></div>
    <div class="block drop"><div class="label">버릴 것</div><p>${esc(r.drop)}</p></div>`;
  document.getElementById('sheet').showModal();
}
</script>
</body>
</html>
