<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>디자인 랩 — 채용 포스터</title>
<link rel="stylesheet" href="/styles.css">
<header class="top">
  <h1>디자인 랩</h1>
  <nav class="tabs">
    <button class="tab on" data-view="refs">레퍼런스</button>
    <button class="tab" data-view="studio">포스터 스튜디오</button>
    <button class="tab" data-view="queue">발행 큐</button>
  </nav>
  <span class="hint" id="hint">8780 · 파이프라인과 분리된 실험실</span>
</header>

<!-- 1. 수집한 jpg 와 거기서 읽어낸 특징 -->
<main id="view-refs" class="view on">
  <section class="synthesis" id="synthesis"></section>
  <div class="filters" id="ref-filters"></div>
  <div class="refs" id="refs"></div>
</main>

<!-- 2. 공고 하나를 포스터로 접는다 -->
<main id="view-studio" class="view">
  <aside class="picker">
    <input id="job-q" type="search" placeholder="회사 · 직무 검색 (예: 토스, 백엔드)" autocomplete="off">
    <div class="joblist" id="joblist"></div>
  </aside>
  <section class="stage">
    <div class="controls" id="controls"></div>
    <div class="canvas-wrap"><div class="holder"><iframe id="preview" title="포스터 미리보기"></iframe></div></div>
    <div class="stage-side">
      <div class="tplnote" id="tplnote"></div>
      <div class="captions" id="captions"></div>
      <div class="actions">
        <label class="plats" id="plats"></label>
        <button id="btn-queue" class="primary" disabled>발행 큐에 넣기</button>
      </div>
    </div>
  </section>
</main>

<!-- 3. 어디에 무엇을 올렸는지의 원장 -->
<main id="view-queue" class="view">
  <div class="creds" id="creds"></div>
  <div class="items" id="items"></div>
</main>

<div class="lightbox" id="lightbox" hidden><img id="lightbox-img" alt=""></div>
<script src="/app.js"></script>
