<!-- swiss_white — hire-04(df.designfever). 여백 90%, 정보는 네 귀퉁이. 짧은 공고 전용. -->
<meta charset="utf-8">
<title>{{company}} · {{role}}</title>
<style>
  :root{--u:min(1vw,1vh);--bg:#f6f5f1;--ink:#101010;--accent:{{palette.accent}}}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden}
  body{background:var(--bg);color:var(--ink);font-family:-apple-system,'Apple SD Gothic Neo','Pretendard','Noto Sans KR',sans-serif;-webkit-font-smoothing:antialiased}
  .canvas{position:relative;width:100%;height:100%;padding:calc(6*var(--u))}
  .corner{position:absolute;font-size:calc(2.2*var(--u));letter-spacing:.14em;text-transform:uppercase}
  .tl{top:calc(6*var(--u));left:calc(6*var(--u))}
  .tr{top:calc(6*var(--u));right:calc(6*var(--u));text-align:right;color:var(--accent)}
  .bl{bottom:calc(6*var(--u));left:calc(6*var(--u));max-width:52%;text-transform:none;letter-spacing:0;
    font-size:calc(2.8*var(--u));font-weight:600;line-height:1.35}
  .br{bottom:calc(6*var(--u));right:calc(6*var(--u));text-align:right;opacity:.55}
  .center{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:0 12%}
  .center .mark{width:calc(13*var(--u));height:calc(13*var(--u));border-radius:50%;background:var(--ink);color:var(--bg);
    display:grid;place-items:center;font-size:calc(6*var(--u));font-weight:800;margin:0 auto calc(3.4*var(--u));overflow:hidden}
  .center .mark img{width:100%;height:100%;object-fit:cover}
  .center h1{font-size:calc(3.6*var(--u));font-weight:500;letter-spacing:-.01em;line-height:1.3}
</style>
<div class="canvas">
  <div class="corner tl">Job Opening</div>
  <div class="corner tr">{{#if deadline}}{{deadline}}{{/if}}</div>
  <div class="center">
    <div>
      <div class="mark">{{#if mark}}<img src="{{mark}}" alt="">{{/if}}{{#unless mark}}{{initial}}{{/unless}}</div>
      <h1>{{role}}</h1>
    </div>
  </div>
  <div class="corner bl">{{company}}</div>
  <div class="corner br">{{#each meta}}{{.}} · {{/each}}{{site}}</div>
</div>
