<!doctype html>
<!-- 3D 해부도 장면: 헬스&뷰티 매장 단면(shot02). 로고·간판·글자 없음 — 실제 매장 재현이 아니라 연출이다.
     poster/scene3d.py 가 window.render(t) 를 프레임마다 불러 캔버스를 찍는다(결정적). -->
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#e9ebe6;overflow:hidden}canvas{display:block}</style>
</head><body>
<script type="module">
import * as THREE from '../vendor/three.module.min.js';
const W = 1080, H = 1920;
const renderer = new THREE.WebGLRenderer({antialias: true, preserveDrawingBuffer: true});
renderer.setPixelRatio(1); renderer.setSize(W, H);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = .9;
document.body.append(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color('#e7eae3');
scene.fog = new THREE.Fog('#e7eae3', 60, 140);
const cam = new THREE.PerspectiveCamera(26, W / H, 0.1, 400);

// 빛 — 하늘/땅 반사 + 해(그림자)
scene.add(new THREE.HemisphereLight('#fffdf6', '#aab4a4', .95));
const sun = new THREE.DirectionalLight('#fff1dc', 2.4); sun.position.set(-18, 34, 22); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, {left: -30, right: 30, top: 30, bottom: -30, near: 1, far: 120});
sun.shadow.bias = -0.0004; sun.shadow.radius = 4; scene.add(sun);

const clay = c => new THREE.MeshStandardMaterial({color: c, roughness: .92, metalness: 0});
const box = (w, h, d, mat, x, y, z, parent = scene) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y + h / 2, z); m.castShadow = m.receiveShadow = true; parent.add(m); return m; };

// 땅·길·이웃 건물(흐린 회색)
const ground = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), clay('#dde1d8')); ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
box(80, .05, 7, clay('#c9cec4'), 0, 0, 9);                           // 앞 도로
box(80, .12, 2, clay('#eef0ea'), 0, 0, 5.2);                         // 인도
const grey = clay('#cfd3cc');
[[-17, 5, -2], [18, 6, -3], [0, 9, -18], [-15, 7, -18], [16, 6, -18]].forEach(([x, h, z]) => box(9.5, h, 9, grey, x, 0, z));

// 매장
const store = new THREE.Group(); scene.add(store);
const wallM = clay('#f4f5f1'), floorM = clay('#e8e4dc'), green = clay('#82DC28'), coral = clay('#FF7878');
box(10, .2, 5, clay('#eef5e2'), 0, 0, 1.5, store); box(10, .2, 3, clay('#efe2cf'), 0, 0, -2.5, store);   // 바닥: 매장(연두빛) / 재고실(종이색)
box(10, 3, .25, wallM, 0, 0, -4, store);                           // 뒷벽(단면 높이 3)
box(.25, 3, 8, wallM, -5, 0, 0, store); box(.25, 3, 8, wallM, 5, 0, 0, store);   // 옆벽
// 칸막이(가운데, 문 하나) — 앞: 매장 / 뒤: 재고실
box(3.6, 1.4, .2, wallM, -3.2, 0, -1, store); box(3.6, 1.4, .2, wallM, 3.2, 0, -1, store);   // 칸막이는 낮게 잘라 재고실이 보이게
// 앞벽(유리 + 연두 틀) — 열리는 부분
// 앞벽은 아랫변(z=4)을 축으로 앞으로 눕는다 — 그룹 원점을 그 자리에 둔다
const front = new THREE.Group(); front.position.set(0, 0, 4); store.add(front);
const glass = new THREE.MeshStandardMaterial({color: '#cfeede', roughness: .1, transparent: true, opacity: .42});
box(9.6, 3.2, .12, glass, 0, .3, 0, front); box(10, .5, .3, green, 0, 3.7, 0, front); box(.3, 4.2, .3, green, -4.9, 0, 0, front); box(.3, 4.2, .3, green, 4.9, 0, 0, front);
// 지붕 — 들리는 부분
const roof = box(10.6, .45, 8.6, clay('#f7f8f4'), 0, 4.2, 0, store); roof.material = roof.material.clone(); roof.material.transparent = true;
const roofLip = box(10.8, .2, .6, green, 0, 4.2, 4.2, store);

// 매장 쪽: 낮은 진열대 + 작은 병들(파스텔)
const pastel = ['#ffd6d6', '#d9f2c4', '#fff0c2', '#d8e6ff', '#f5d9f0', '#ffe2cc'];
let seed = 3; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
for (const [x, z] of [[-2.6, .6], [0, .6], [2.6, .6], [-2.6, 2.4], [0, 2.4], [2.6, 2.4]]) {
  box(2.1, .9, .9, clay('#ffffff'), x, .2, z, store); box(2.12, .08, .92, green, x, 1.1, z, store);
  for (let i = 0; i < 7; i++) { const h = .35 + rnd() * .3; const m = new THREE.Mesh(new THREE.CylinderGeometry(.09, .1, h, 16), clay(pastel[(i + Math.floor(x + z)) % pastel.length]));
    m.position.set(x - .9 + i * .3, 1.1 + h / 2, z + (rnd() - .5) * .3); m.castShadow = true; store.add(m); }
}
box(1.6, 1.05, .7, clay('#ffffff'), -3.6, .2, 3.3, store); box(1.7, .08, .8, green, -3.6, 1.25, 3.3, store);   // 계산대
// 재고실 쪽: 쌓인 상자 + 포장대 + 강조 상자(코럴)
const kraft = clay('#d9b98f'), kraft2 = clay('#cfa977');
for (let i = 0; i < 4; i++) for (let j = 0; j < 3; j++) for (let k = 0; k < 2 + (i + j) % 2; k++)
  box(.8, .6, .8, (i + j + k) % 2 ? kraft : kraft2, -4 + i * .9, .2 + k * .62, -3.5 + j * .85, store);
box(2.6, .95, 1.2, clay('#ffffff'), 2.6, .2, -2.6, store);
const hot = box(.7, .5, .6, coral, 2.2, 1.15, -2.6, store); const hot2 = box(.6, .45, .5, kraft, 3.0, 1.15, -2.55, store);
box(.3, 3.4, 2.4, clay('#e3e6df'), 4.6, .2, -2.5, store);                                                      // 선반 벽

// 매장 안 빛(단면이 열리면 켜진다)
const inside = new THREE.PointLight('#fff4e0', 0, 16, 1.6); inside.position.set(0, 3.4, 1); scene.add(inside);
const inside2 = new THREE.PointLight('#f7ffe8', 0, 12, 1.6); inside2.position.set(0, 3.2, -2.6); scene.add(inside2);

const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
window.render = t => {
  // 카메라: 비스듬히 위에서 천천히 돌며 다가간다
  const a = THREE.MathUtils.degToRad(32 + 16 * ease(t / 5)), r = 40 - 6 * ease(t / 5), y = 46 - 6 * ease(t / 5);
  cam.position.set(Math.sin(a) * r, y, Math.cos(a) * r); cam.lookAt(0, .6, -.3);
  // 지붕이 들리고 사라진다
  const up = ease((t - .8) / 1.6); roof.position.y = 4.2 + .22 + up * 9; roofLip.position.y = 4.2 + .1 + up * 9;
  roof.material.opacity = 1 - clamp((t - 1.6) / .8); roof.visible = roof.material.opacity > .01; roofLip.visible = roof.visible;
  roofLip.material.transparent = true; roofLip.material.opacity = roof.material.opacity;
  // 앞벽이 앞으로 눕듯 내려간다
  const fw = ease((t - 1.6) / 1.4); front.rotation.x = fw * Math.PI / 2 * .97;
  // 안쪽 빛
  inside.intensity = 7 * ease((t - 1.8) / 1.2); inside2.intensity = 6 * ease((t - 2.2) / 1.2);
  // 강조 상자가 박자처럼 두 번 뛴다
  const p = clamp((t - 3.4) / 1.4); const s = 1 + .18 * Math.max(0, Math.sin(p * Math.PI * 2)) * (p > 0 ? 1 : 0);
  hot.scale.setScalar(s); hot.position.y = 1.15 + .25 + (s - 1) * .3;
  renderer.render(scene, cam);
  return true;
};
window.render(0);
window.__ready = true;
</script>
</body></html>
