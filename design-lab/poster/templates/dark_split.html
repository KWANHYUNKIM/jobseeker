<!-- dark_split — latam-03(AURE Arquitectura)의 틀.
     어두운 바탕에 작은 라벨 → 직군명 크게 → 테두리 친 한 줄. 그 아래 요구 사항은 전체 폭,
     맨 아래는 세로선으로 갈라 '제공(복지)' 과 '조건' 을 마주 세운다. 지원처는 가운데 두 줄. -->
<meta charset="utf-8">
<title>dark_split</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#222}
  body{-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word}
  .sheet{width:var(--w);height:var(--h);background:var(--ink);color:var(--paper);font-family:var(--font);
    padding:calc(7*var(--u)) calc(8*var(--u)) calc(5.4*var(--u));display:flex;flex-direction:column;position:relative}
  .mark{position:absolute;right:calc(8*var(--u));top:calc(6.4*var(--u));font-size:calc(3*var(--u));font-weight:700;letter-spacing:-.03em}
  .label{font-size:calc(2.2*var(--u));letter-spacing:.04em;color:color-mix(in srgb,var(--paper) 72%,transparent)}
  h1{margin-top:calc(1.4*var(--u));font-size:calc(5.4*var(--u));font-weight:800;letter-spacing:-.03em;line-height:1.14;max-width:88%}
  .box{align-self:flex-start;margin-top:calc(1.8*var(--u));border:1px solid var(--accent);padding:calc(.7*var(--u)) calc(2*var(--u));
    font-size:calc(2.3*var(--u));letter-spacing:.02em}

  .body{flex:1;min-height:0;overflow:hidden;margin-top:calc(3.6*var(--u));display:flex;flex-direction:column;gap:calc(var(--f)*1.3)}
  h2{font-size:calc(var(--f)*1.12);font-weight:800;letter-spacing:.06em;margin-bottom:calc(var(--f)*.4)}
  h3{font-size:var(--f);font-weight:700;margin:calc(var(--f)*.3) 0 calc(var(--f)*.1)}
  ul{list-style:none}
  li{font-size:var(--f);line-height:1.5;padding-left:calc(var(--f)*1);position:relative;color:color-mix(in srgb,var(--paper) 88%,transparent)}
  li::before{content:'•';position:absolute;left:0}
  .two{display:grid;grid-template-columns:var(--c1) 1px 1fr;column-gap:calc(var(--f)*1.6)}
  .two .rule{background:color-mix(in srgb,var(--paper) 55%,transparent)}
  .pairs{display:grid;grid-template-columns:max-content 1fr;column-gap:calc(var(--f)*.9);font-size:var(--f);line-height:1.5}
  .pairs b{font-weight:700;white-space:nowrap}
  .pairs span{color:color-mix(in srgb,var(--paper) 88%,transparent)}
  .req{display:grid;column-gap:calc(var(--f)*2)}

  footer{flex:none;text-align:center;margin-top:calc(2.6*var(--u));line-height:1.5}
  footer b{display:block;font-size:calc(2.4*var(--u));font-weight:700}
  footer span{font-size:calc(2.2*var(--u));color:color-mix(in srgb,var(--paper) 80%,transparent)}
</style>
<div id="root"></div>
<script id="data" type="application/json">/*__DATA__*/</script>
<script>/*__FRAME_JS__*/</script>
<script>
(async () => {
  const F = await Frame.init();
  const { D, S, el } = F;
  const sheet = el('section', 'sheet'); document.getElementById('root').append(sheet);
  if (F.brand && F.brand.wordmark) sheet.append(el('div', 'mark', F.brand.wordmark));
  sheet.append(el('div', 'label', '채용 공고'), el('h1', '', D.role));
  const boxText = [D.company, ...((F.brand && F.brand.facts) || []).slice(0, 1)].join(' · ');
  sheet.append(el('div', 'box', boxText));
  const body = el('div', 'body'); sheet.append(body);
  const footer = el('footer'); footer.append(el('b', '', D.company), el('span', '', D.career || '')); sheet.append(footer);

  const ul = items => { const u = el('ul'); items.forEach(t => u.append(el('li', '', t))); return u; };
  const draw = c => {
    body.replaceChildren();
    const tasks = el('div'); tasks.append(el('h2', '', '주요업무'));
    const tg = el('div', 'req'); tg.style.gridTemplateColumns = c.taskCols === 2 ? '1fr 1fr' : '1fr';
    S.tasks.forEach(g => { const d = el('div'); if (g.title) d.append(el('h3', '', g.title)); d.append(ul(g.items)); tg.append(d); });
    tasks.append(tg); body.append(tasks);

    const req = el('div'); req.append(el('h2', '', '자격요건'));
    const rg = el('div', 'req'); rg.style.gridTemplateColumns = c.reqCols === 2 ? '1fr 1fr' : '1fr';
    const q = el('div'); q.append(ul(S.qualifications));
    const p = el('div'); p.append(el('h3', '', '우대사항'), ul(S.preferences));
    rg.append(q, p); req.append(rg); body.append(req);

    const two = el('div', 'two'); F.set('c1', '1.5fr');
    const give = el('div'); give.append(el('h2', '', '제공'));
    if (S.benefits.some(b => b.label)) { const gp = el('div', 'pairs'); S.benefits.forEach(b => gp.append(el('b', '', b.label), el('span', '', b.text))); give.append(gp); }
    else give.append(ul(S.benefits.map(b => b.text)));
    const cond = el('div'); cond.append(el('h2', '', '조건'));
    const cp = el('div', 'pairs');
    [['경력', F.career], ['기술', D.stack.join(', ')], ['마감', D.deadline]].forEach(([k, v]) => { if (v) cp.append(el('b', '', k), el('span', '', v)); });
    cond.append(cp);
    two.append(give, el('div', 'rule'), cond); body.append(two);
    return !Frame.overflows(body);
  };
  Frame.fit(F, [{ taskCols: 1, reqCols: 1 }, { taskCols: 2, reqCols: 1 }, { taskCols: 1, reqCols: 2 }, { taskCols: 2, reqCols: 2, columns: 2 }], draw);
})();
</script>
