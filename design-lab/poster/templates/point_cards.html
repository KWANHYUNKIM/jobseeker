<!-- point_cards — detail-04(design_j_d). Point.01/02/03 으로 '지금 몇 번째'를 알려 준다. -->
<meta charset="utf-8">
<title>{{company}} · {{role}}</title>
<style>
  :root{--u:min(1vw,1vh);--bg:{{palette.bg}};--ink:{{palette.ink}};--accent:{{palette.accent}};--soft:{{palette.soft}}}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden}
  body{background:var(--bg);color:var(--ink);font-family:-apple-system,'Apple SD Gothic Neo','Pretendard','Noto Sans KR',sans-serif;-webkit-font-smoothing:antialiased}
  .canvas{width:100%;height:100%;padding:calc(6.5*var(--u));display:flex;flex-direction:column;gap:calc(4*var(--u))}
  .kicker{font-size:calc(2.3*var(--u));letter-spacing:.2em;color:var(--accent)}
  h1{font-size:calc(4.4*var(--u));font-weight:800;letter-spacing:-.03em;line-height:1.1;max-width:22ch}
  .cards{flex:1;display:grid;gap:calc(2.4*var(--u));align-content:center}
  .canvas[data-orient="landscape"] .cards{grid-auto-flow:column;grid-auto-columns:1fr;align-content:stretch}
  .card{background:var(--soft);border-radius:calc(2*var(--u));padding:calc(3.4*var(--u));
    display:flex;gap:calc(2.6*var(--u));align-items:flex-start}
  .canvas[data-orient="landscape"] .card{flex-direction:column}
  .no{font-size:calc(3.4*var(--u));font-weight:800;color:var(--accent);letter-spacing:-.02em;flex:none}
  .no small{font-size:calc(1.8*var(--u));opacity:.7;display:block;letter-spacing:.14em}
  .txt{font-size:calc(2.7*var(--u));line-height:1.45}
  footer{display:flex;justify-content:space-between;align-items:center;font-size:calc(2.3*var(--u));opacity:.75}
  footer b{font-weight:600;opacity:1}
</style>
<div class="canvas" data-orient="{{orient}}">
  <div>
    <div class="kicker">이 자리가 요구하는 것</div>
    <h1>{{role}}</h1>
  </div>
  <div class="cards">
    {{#each qualifications}}
    <div class="card"><div class="no"><small>POINT</small>{{@index}}</div><div class="txt">{{.}}</div></div>
    {{/each}}
  </div>
  <footer><b>{{company}}</b><span>{{#if deadline}}{{deadline}}{{/if}}</span></footer>
</div>
