<!-- brand_socar — 쏘카 전용 판 v1. brands/쏘카.json 의 signature 를 판의 얼굴로 쓴다.
     signature  expand-light-road   2025 리브랜딩 그래픽 'Expand' — 빛의 선이 소실점으로 모이는 도로.
                                    리브랜딩 필름 frame 334 원본을 머리에 깔고, 필름이 'Lifetime Mobility' 를
                                    얹은 자리(소실점 위 수평선)에 직무명을 같은 서체·같은 방향 그라디언트로.
     supporting film-type-gradient  제목 한 줄만 Blue 01 → 05 → 07
                dark-ground-blue    판 전체 남색(Blue 10), 섹션 이름 Blue 04, 목록 앞 짧은 빛줄기 Blue 05
     안 쓰는 것: 심볼·로고타입·쏘카핀·쏘카존 사인(로고 규정), 필름 자막 프레임, 흰 바탕(토스와 겹침)
     서체: IBM Plex Sans KR(OFL) — 브랜드 센터 웹폰트이자 필름 글자와 겹침 1위 -->
<meta charset="utf-8">
<title>brand_socar</title>
<style>
  /*__FONTS__*/
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#222}
  body{-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word}
  .sheet{position:relative;width:var(--w);height:var(--h);color:var(--ink);font-family:var(--font);display:flex;flex-direction:column;overflow:hidden;
    background:linear-gradient(180deg,var(--sky) 0,var(--sky) calc(var(--H)*.55),var(--paper) calc(var(--H) + 6*var(--u)),var(--paper) 100%)}

  /* 머리 — 필름의 수평선. 위는 하늘(글자), 아래는 빛의 도로 */
  header{position:relative;flex:none;height:var(--H);overflow:hidden}
  header .road{position:absolute;left:0;right:0;top:var(--IMG-TOP);width:100%;display:block}
  header .fade{position:absolute;left:0;right:0;bottom:0;height:calc(var(--H)*.30);background:linear-gradient(180deg,rgba(5,10,90,0) 0,var(--paper) 100%)}
  .top{position:absolute;left:calc(4.4*var(--u));top:calc(2.6*var(--u))}
  .top .co{font-size:calc(2.5*var(--u));font-weight:700;letter-spacing:-.01em;color:#fff}
    .horizon{position:absolute;left:0;right:0;bottom:calc(100% - var(--HZ));text-align:center;padding-bottom:calc(.9*var(--u))}
  .career{font-size:calc(var(--CS)*var(--u));font-weight:600;color:var(--accent);letter-spacing:-.01em;line-height:1.1}
  .career b{font-weight:700;color:#fff}
  h1{margin-top:calc(.6*var(--u));font-size:calc(var(--TS)*var(--u));font-weight:700;letter-spacing:-.02em;line-height:1.02;
    background:linear-gradient(90deg,var(--g1) 8%,var(--g2) 55%,var(--g3) 92%);-webkit-background-clip:text;background-clip:text;color:transparent}

  /* 본문 — 원문 순서대로 두 단에 흘린다 */
  main{flex:1;min-height:0;overflow:hidden;margin:calc(-3.2*var(--u)) calc(4.4*var(--u)) 0;position:relative;
    column-count:2;column-gap:calc(var(--f)*1.5);column-fill:auto}
  .sec{break-inside:auto}
  .sec + .sec{margin-top:calc(var(--f)*.75)}
  h2{break-after:avoid;font-size:calc(var(--f)*1.02);font-weight:600;color:var(--accent);letter-spacing:.02em;line-height:1.3;
    padding-bottom:calc(var(--f)*.3);margin-bottom:calc(var(--f)*.45);border-bottom:1px solid var(--line)}
  .it{break-inside:avoid;position:relative;font-size:var(--f);line-height:1.46;color:var(--text);font-weight:400;padding-left:calc(var(--f)*1.1);margin-bottom:calc(var(--f)*.3);text-wrap:pretty}
  .it::before{content:'';position:absolute;left:0;top:calc(var(--f)*.72);width:calc(var(--f)*.8);height:2px;border-radius:2px;
    background:linear-gradient(90deg,rgba(51,147,255,0) 0,var(--trail) 100%)}
  .it b{font-weight:600;color:#fff}
  .sub{break-after:avoid;font-size:calc(var(--f)*.9);font-weight:600;color:#fff;margin:calc(var(--f)*.55) 0 calc(var(--f)*.25)}
  .sub:first-of-type{margin-top:0}
  .note{break-inside:avoid;font-size:calc(var(--f)*.8);line-height:1.45;color:var(--sub);margin-top:calc(var(--f)*.3)}

  footer{flex:none;margin:calc(.8*var(--u)) calc(4.4*var(--u)) 0;padding:calc(1.4*var(--u)) 0 calc(2.2*var(--u));border-top:1px solid var(--line);
    display:flex;justify-content:space-between;align-items:flex-end;gap:calc(3*var(--u))}
  .slogan{font-size:calc(2.3*var(--u));font-weight:700;letter-spacing:-.01em;color:#fff;white-space:nowrap}
  .stack{margin-top:calc(.4*var(--u));font-size:calc(1.6*var(--u));font-weight:500;color:var(--sub);white-space:nowrap}
  .apply{text-align:right;white-space:nowrap}
  .apply .lab{font-size:calc(1.7*var(--u));font-weight:500;color:var(--sub)}
  .apply .url{margin-top:calc(.1*var(--u));font-size:calc(2.2*var(--u));font-weight:600;color:#fff}
  .apply .url i{font-style:normal;color:var(--accent);margin-left:calc(.7*var(--u))}
</style>
<div id="root"></div>
<script id="data" type="application/json">/*__DATA__*/</script>
<script>/*__FRAME_JS__*/</script>
<script>
(async () => {
  const F = await Frame.init();
  const { D, S, el, ui } = F;
  const B = F.brand || {};
  const IMG = D.brand_images || {};
  const g = ui.title_gradient || ['#ebf5ff', '#3393ff', '#005aff'];
  F.set('g1', g[0]); F.set('g2', g[1]); F.set('g3', g[2]);
  F.set('sky', ui.sky || '#020019'); F.set('line', ui.line || '#262f3c'); F.set('trail', ui.trail || '#3393ff');

  const sheet = el('section', 'sheet'); document.getElementById('root').append(sheet);

  // 머리
  const header = el('header');
  if (IMG.road) { const im = el('img', 'road'); im.src = IMG.road; im.alt = ''; header.append(im); }
  header.append(el('div', 'fade'));
  const top = el('div', 'top');
  top.append(el('div', 'co', B.wordmark || D.company));
  header.append(top);
  const hz = el('div', 'horizon');
  const car = el('div', 'career'); car.textContent = D.meta.join(' · ');
  hz.append(car, el('h1', '', D.title || D.role));
  header.append(hz);
  sheet.append(header);

  const main = el('main'); sheet.append(main);

  const footer = el('footer');
  const left = el('div'); left.append(el('div', 'slogan', B.slogan || ''));
  if (D.stack.length) left.append(el('div', 'stack', [...new Set(D.stack)].join(' · ')));
  const apply = el('div', 'apply');
  footer.append(left, apply); sheet.append(footer);

  // 원문 → 섹션. 글자는 그대로, 'A: B' 는 A 만 굵게, '[..]' 는 소제목, '*' 로 시작하면 주석
  const txt = it => (typeof it === 'string' ? it : it.text);
  const item = s => {
    const d = el('div', 'it');
    const m = s.match(/^([^:：]{2,24})([:：]\s*)([\s\S]+)$/);
    if (m) { d.append(el('b', '', m[1] + m[2].trimEnd()), document.createTextNode(' ' + m[3])); }
    else d.textContent = s;
    return d;
  };
  const secs = [];
  const addSec = (title, items) => {
    if (!items.length) return;
    const s = el('div', 'sec'); s.append(el('h2', '', title));
    for (const raw of items) {
      const t = txt(raw);
      if (/^\[.+\]$/.test(t)) s.append(el('div', 'sub', t));
      else if (/^\*\s/.test(t)) s.append(el('div', 'note', t));
      else if (typeof raw !== 'string' && raw.label) { const d = el('div', 'it'); d.append(el('b', '', raw.label + ' '), document.createTextNode(raw.text)); s.append(d); }
      else s.append(item(t));
    }
    secs.push(s);
  };
  S.tasks.forEach(t => addSec(t.title || '주요업무', t.items));
  addSec('자격요건', S.qualifications);
  addSec('우대사항', S.preferences);
  addSec('복지', S.benefits);
  main.append(...secs);

  // 머리 높이 후보 — 머리가 크면 본문이 작아진다. 16px 아래로 떨어지지 않는 가장 큰 머리
  const U = D.fmt.w / 100;
  // H 머리 높이, HZ 수평선(소실점) 높이, TS 제목, CS 경력 — 모두 u
  const heads = [
    { H: 38, HZ: 21.5, TS: 9.4, CS: 3.6 },
    { H: 35, HZ: 19.5, TS: 8.6, CS: 3.3 },
    { H: 32.5, HZ: 18, TS: 7.9, CS: 3.1 },
    { H: 30, HZ: 16.5, TS: 7.2, CS: 2.9 },
  ];
  const horizon = 100 * 318 / 1920;            // road_horizon_334.jpg(1920×658) 를 판 폭에 맞췄을 때 소실점 y(u)
  const draw = c => {
    F.set('H', `calc(${c.H}*var(--u))`);
    F.set('IMG-TOP', `calc(${(c.HZ - horizon).toFixed(2)}*var(--u))`);
    F.set('HZ', `calc(${c.HZ}*var(--u))`);
    F.set('TS', c.TS); F.set('CS', c.CS);
    return !Frame.overflows(main);
  };
  // Frame.fit 은 글자가 가장 큰 후보를 고르므로 늘 가장 작은 머리가 이긴다 — 머리 큰 순서로 하나씩 재고
  // 본문이 MIN 이상이면 그 머리에서 멈춘다
  const MIN = 16.2;
  for (const h of heads) {
    Frame.fit(F, [{ ...h, columns: 2 }], draw, { lo: 10, hi: 30 });
    window.__layout.head = h;
    if (window.__layout.font_px >= MIN || h === heads[heads.length - 1]) break;
  }
})();
</script>
