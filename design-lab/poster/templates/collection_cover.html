<!doctype html>
<!-- 묶음 표지 — 캐러셀 첫 장. 뒤에 오는 판들의 '차례' 다.
     장식은 넣지 않는다. 카테고리 이름 · 기간(또는 직군) · 몇 곳 · 회사 목록, 이 넷이 전부다.
     poster/collection.py 가 /*__DATA__*/ 자리에 묶음 데이터를 박고 .sheet 를 찍는다. -->
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  :root { --ink: #12141a; --sub: #6b7280; --line: #d9dde5; --paper: #f6f4f0; --accent: #1b6ef3; }
  * { box-sizing: border-box; margin: 0; }
  body { background: #222; }
  .sheet {
    width: 1080px; height: 1350px; background: var(--paper); color: var(--ink);
    font-family: 'Pretendard', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
    padding: 84px 76px 72px; display: flex; flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }
  .kicker { font-size: 26px; font-weight: 700; letter-spacing: .02em; color: var(--accent); }
  h1 { font-size: 96px; line-height: 1.02; font-weight: 800; letter-spacing: -.03em; margin-top: 14px; }
  h1 .thin { font-weight: 400; color: var(--sub); }
  .sub { margin-top: 18px; font-size: 30px; color: var(--sub); font-weight: 500; }
  .count { margin-top: 30px; display: flex; align-items: baseline; gap: 12px;
           border-top: 5px solid var(--ink); padding-top: 22px; }
  .count b { font-size: 74px; font-weight: 800; letter-spacing: -.03em; }
  .count span { font-size: 26px; color: var(--sub); font-weight: 600; }
  ol { list-style: none; margin-top: 26px; flex: 1; display: flex; flex-direction: column; justify-content: flex-start; }
  li { display: grid; grid-template-columns: 62px 1fr auto; align-items: baseline;
       gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--line); }
  li .no { font-size: 22px; color: var(--sub); font-variant-numeric: tabular-nums; font-weight: 700; }
  li .co { font-size: 31px; font-weight: 800; letter-spacing: -.02em; }
  li .ro { font-size: 23px; color: var(--sub); margin-top: 4px; font-weight: 500; }
  li .ca { font-size: 21px; color: var(--ink); font-weight: 700; white-space: nowrap; text-align: right; }
  li .ca .until { font-size: 18px; color: var(--accent); font-weight: 700; margin-top: 3px; }
  li .tag { font-size: 18px; color: var(--sub); font-weight: 600; margin-left: 8px; }
  footer { margin-top: 20px; display: flex; justify-content: space-between; align-items: flex-end;
           font-size: 21px; color: var(--sub); font-weight: 600; }
  footer b { color: var(--ink); font-size: 23px; }
</style>
</head>
<body>
<div id="root"></div>
<script id="data" type="application/json">/*__DATA__*/</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
(function () {
  const el = (t, c, x) => { const n = document.createElement(t); if (c) n.className = c; if (x != null) n.textContent = x; return n; };
  const sheet = el('section', 'sheet');
  sheet.append(el('div', 'kicker', D.kicker || ''));

  // 제목이 '9월 16일–22일' 처럼 기간이면 뒤쪽을 얇게 — 숫자가 주인공이 되게
  const h1 = el('h1');
  const m = (D.title || '').match(/^(.+?)(마감|채용|개발자|쓰는 곳)$/);
  if (m) { h1.append(m[1]); h1.append(el('span', 'thin', m[2])); } else h1.append(D.title || '');
  sheet.append(h1);
  if (D.sub) sheet.append(el('div', 'sub', D.sub));

  const count = el('div', 'count');
  count.append(el('b', '', `${D.count}곳`), el('span', '', '이 안에 있습니다'));
  sheet.append(count);

  const ol = el('ol');
  (D.jobs || []).forEach((j, i) => {
    const li = el('li');
    li.append(el('div', 'no', String(i + 1).padStart(2, '0')));
    const mid = el('div');
    const co = el('div', 'co', j.company);
    const size = (D.size_label || {})[j.company];
    if (size && size !== '중소기업') co.append(el('span', 'tag', size));
    mid.append(co, el('div', 'ro', j.role));
    const right = el('div', 'ca');
    right.append(el('div', '', (j.career || '').replace(/^경력\s*/, '')));
    // '언제까지' 는 이 판에서 경력만큼 중요하다 — 회사마다 오른쪽에 함께 세운다
    if (j.until) right.append(el('div', 'until', j.until));
    li.append(mid, right);
    ol.append(li);
  });
  sheet.append(ol);

  const foot = el('footer');
  foot.append(el('div', '', '넘겨서 공고 전문 보기 →'));
  const right = el('div'); right.append(el('b', '', '@devjobseeker'));
  foot.append(right);
  sheet.append(foot);
  document.getElementById('root').append(sheet);

  // 목록이 길면 줄어들게 — 넘치면 글자와 여백을 같이 줄인다
  const fits = () => sheet.scrollHeight <= sheet.clientHeight && ol.scrollHeight <= ol.clientHeight + 1;
  let scale = 1;
  while (!fits() && scale > 0.6) {
    scale -= 0.04;
    ol.querySelectorAll('li').forEach(li => {
      li.style.padding = `${14 * scale}px 0`;
      li.querySelector('.co').style.fontSize = `${31 * scale}px`;
      li.querySelector('.ro').style.fontSize = `${23 * scale}px`;
      li.querySelector('.ca').style.fontSize = `${21 * scale}px`;
      const u = li.querySelector('.until'); if (u) u.style.fontSize = `${18 * scale}px`;
      li.querySelector('.no').style.fontSize = `${22 * scale}px`;
    });
  }
  window.__fit = scale;
  window.__ready = true;
})();
</script>
</body>
</html>
