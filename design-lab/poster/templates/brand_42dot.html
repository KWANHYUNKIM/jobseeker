<!-- brand_42dot — 포티투닷 전용 판 v1. brands/포티투닷.json 의 signature 를 판의 얼굴로 쓴다.
     signature  ascii-42-asterisk   About 페이지의 ASCII 코드표. Code 40·41·42·43·44 가 세로로 흐르다
                                    42 에서 멈추고 그 자리 글자가 * 로 드러난다. 회사 이름이 곧 이 장치다
                                    (42 = asterisk 의 ASCII, dot = * 를 줄인 것).
                                    원본 실측: 잔줄 #ffffff4d / weight 300, 하이라이트 weight 400,
                                    * 가 42 보다 1.7배 크고 아래·오른쪽으로 밀려 앉는다.
     supporting wildcard-line       '모든 문자를 매칭할 수 있는 와일드카드' — 코드표 옆 공식 설명문 그대로.
     안 쓰는 것: CI 심볼(별표+화살표 — 로고 변형 탈락), 차량·도로·라이다, 수치 카드,
                 그라디언트·글로우·3D, 둥근 모서리(42dot 은 border-radius 0), 보라를 판 전체에 깔기
     서체: Asta Sans(OFL, github.com/42dot/Asta-Sans) — 판의 * 가 이 서체의 글리프여야 고리가 산다 -->
<meta charset="utf-8">
<title>brand_42dot</title>
<style>
  /*__FONTS__*/
  *{box-sizing:border-box;margin:0;padding:0;border-radius:0}
  html,body{background:#fff}
  body{-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word}
  .sheet{position:relative;width:var(--w);height:var(--h);background:var(--paper);color:var(--ink);
    font-family:var(--font);display:flex;flex-direction:column;overflow:hidden}

  /* 머리 — 보라 한 판. 왼쪽 코드표, 오른쪽 42 * */
  header{flex:none;height:var(--H);background:var(--violet);color:#fff;position:relative;
    display:flex;align-items:center;gap:calc(4*var(--u));padding:0 calc(5*var(--u))}

  /* 코드표 기둥 하나 — 위아래가 사라지고 가운데(42)만 또렷한 휠 피커 */
  .code{flex:none;display:flex;flex-direction:column;gap:calc(var(--CG)*var(--u));
    -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 30%,#000 70%,transparent 100%);
    mask-image:linear-gradient(180deg,transparent 0,#000 30%,#000 70%,transparent 100%)}
  .row{display:flex;align-items:baseline;gap:calc(1.5*var(--u));white-space:nowrap;
    font-size:calc(var(--CS)*var(--u));font-weight:300;letter-spacing:-.02em;line-height:1;color:var(--dim)}
  .row.on{color:#fff}
  .row .g{min-width:calc(var(--CS)*.72*var(--u));text-align:center}

  /* 42 * — * 는 1.7배 크고 아래·오른쪽으로 밀린다. 고치면 장치가 죽는다 */
  .hi{margin-left:auto;display:flex;align-items:flex-start;color:#fff;font-weight:400;line-height:.9}
  .hi .n{font-size:calc(var(--NS)*var(--u))}
  .hi .a{font-size:calc(var(--NS)*1.7*var(--u));margin-top:calc(var(--NS)*.62*var(--u));margin-left:calc(var(--NS)*.19*var(--u))}
  .wild{position:absolute;left:calc(5*var(--u));bottom:calc(2.4*var(--u));
    font-size:calc(1.6*var(--u));font-weight:300;color:rgba(255,255,255,.62);letter-spacing:-.01em}

  /* 공고 */
  .bar{flex:none;display:flex;align-items:baseline;gap:calc(1.4*var(--u));
    margin:calc(2.6*var(--u)) calc(5*var(--u)) 0;padding-bottom:calc(1.2*var(--u));border-bottom:1px solid var(--line)}
  .co{font-size:calc(2.3*var(--u));font-weight:600;letter-spacing:-.02em;color:var(--ink)}
  .about{font-size:calc(1.5*var(--u));font-weight:400;color:var(--sub)}
  .career{margin-left:auto;font-size:calc(1.7*var(--u));font-weight:500;color:var(--accent);white-space:nowrap}

  h1{flex:none;margin:calc(1.7*var(--u)) calc(5*var(--u)) calc(1.6*var(--u));
    font-size:calc(var(--TS)*var(--u));font-weight:600;letter-spacing:-.035em;line-height:1.05;text-wrap:balance}

  /* 본문 옆 레일 — 머리에서 멈춘 코드표가 판 끝까지 계속 돈다.
     새 장치가 아니라 시그니처의 연장이다(그래서 장식이 아니다). */
  .body{flex:1;min-height:0;display:flex;gap:calc(2.2*var(--u));margin:0 calc(5*var(--u))}
  main{flex:1;min-width:0;min-height:0;overflow:hidden;
    column-gap:calc(var(--f)*1.6);column-fill:auto}
  .rail{flex:none;width:calc(3.6*var(--u));display:flex;flex-direction:column;
    justify-content:space-between;align-items:flex-end;padding:calc(.4*var(--u)) 0;
    border-left:1px solid var(--line);padding-left:calc(1.1*var(--u))}
  .rail b{font-size:calc(1.12*var(--u));font-weight:300;color:#b9bcc7;
    letter-spacing:-.02em;white-space:nowrap;font-variant-numeric:tabular-nums}
  .rail b i{font-style:normal;color:var(--accent);margin-left:calc(.35*var(--u))}
  .sec{break-inside:auto}
  .sec + .sec{margin-top:calc(var(--f)*.85)}
  h2{break-after:avoid;font-size:calc(var(--f)*.84);font-weight:500;color:var(--accent);letter-spacing:.08em;
    text-transform:uppercase;margin-bottom:calc(var(--f)*.5)}
  .it{break-inside:avoid;position:relative;font-size:var(--f);line-height:1.5;color:var(--text);
    padding-left:calc(var(--f)*1.05);margin-bottom:calc(var(--f)*.34);text-wrap:pretty}
  /* 목록 기호도 애스터리스크다 — 장식이 아니라 같은 글자 */
  .it::before{content:'*';position:absolute;left:0;top:0;color:var(--accent);font-weight:400;opacity:.55}
  .it b{font-weight:600;color:var(--ink)}
  .sub{break-after:avoid;font-size:calc(var(--f)*.94);font-weight:600;color:var(--ink);
    margin:calc(var(--f)*.6) 0 calc(var(--f)*.28)}
  .sub:first-of-type{margin-top:0}
  .note{break-inside:avoid;font-size:calc(var(--f)*.82);line-height:1.45;color:var(--sub);margin-top:calc(var(--f)*.28)}

  footer{flex:none;margin:calc(1.5*var(--u)) calc(5*var(--u)) 0;padding:calc(1.3*var(--u)) 0 calc(2.6*var(--u));
    border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-end;gap:calc(2*var(--u))}
  .slogan{font-size:calc(1.95*var(--u));font-weight:500;letter-spacing:-.02em;color:var(--ink);white-space:nowrap}
  .stack{margin-top:calc(.35*var(--u));font-size:calc(1.45*var(--u));font-weight:400;color:var(--sub)}
  .apply{text-align:right;white-space:nowrap;color:var(--accent)}

  /* ── 표지 ──────────────────────────────────────────────────────────────
     brands/포티투닷.json 의 signature.medium 이 (screen · one-line · print · 휠) 이라
     기본 판이 이것이다. 전문은 --variant full 로 부른다(표지와 본문을 나눈다, 2-1절).

     About 페이지의 코드표를 판 전체로 키운 것. 위아래가 흐려지고 가운데 한 줄만 또렷한
     그 구조가 멈춘 휠이다. 42 에서 멈추면 그 자리 글자가 * 로 드러나고, 회사가 * 를
     '모든 문자를 매칭할 수 있는 와일드카드' 라고 설명하므로 — 멈춘 자리에 공고 한 줄이
     들어오는 것이 이 장치의 원래 쓰임이다. 터미널 창틀·프롬프트·가짜 명령은 그리지 않는다. */
  .cover{background:var(--violet);color:#fff}
  .cover .top{flex:none;display:flex;align-items:baseline;gap:calc(1.2*var(--u));
    padding:calc(4.6*var(--u)) calc(5*var(--u)) 0}
  .cover .top .co{font-size:calc(2.4*var(--u));font-weight:600;color:#fff}
  .cover .top .ab{font-size:calc(1.45*var(--u));font-weight:300;color:rgba(255,255,255,.62)}

  .wheel{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;
    gap:calc(1.5*var(--u));padding:calc(3*var(--u)) calc(5*var(--u));
    -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 22%,#000 78%,transparent 100%);
    mask-image:linear-gradient(180deg,transparent 0,#000 22%,#000 78%,transparent 100%)}
  .wrow{display:flex;align-items:baseline;gap:calc(1.4*var(--u));
    font-size:calc(3.0*var(--u));font-weight:300;letter-spacing:-.02em;line-height:1.12;
    color:rgba(255,255,255,.30);white-space:nowrap}
  .wrow .n{font-variant-numeric:tabular-nums}
  /* 멈춘 줄 — 여기만 흰색 100% 이고, 여기만 줄이 길다 */
  .wrow.on{color:#fff;white-space:normal;align-items:flex-start;
    font-size:calc(var(--MS)*var(--u));font-weight:400}
  .wrow.on .n{font-weight:400}
  .wrow.on .ast{font-size:1.5em;line-height:.8;margin:0 calc(.3*var(--u))}
  .wrow.on .match{font-size:calc(var(--LS)*var(--u));font-weight:400;line-height:1.42;
    letter-spacing:-.01em;word-break:keep-all;text-wrap:pretty}

  .cover .foot{flex:none;padding:0 calc(5*var(--u)) calc(3.4*var(--u));
    display:flex;justify-content:space-between;align-items:flex-end;gap:calc(2*var(--u))}
  .cover .foot .role{font-size:calc(2.4*var(--u));font-weight:600;color:#fff;letter-spacing:-.02em}
  .cover .foot .meta{margin-top:calc(.4*var(--u));font-size:calc(1.5*var(--u));
    font-weight:300;color:rgba(255,255,255,.66)}
  .cover .foot .src{margin-top:calc(.9*var(--u));font-size:calc(1.2*var(--u));
    font-weight:300;color:rgba(255,255,255,.45)}
  .cover .apply{color:#fff}
</style>
<div id="root"></div>
<script id="data" type="application/json">/*__DATA__*/</script>
<script>/*__FRAME_JS__*/</script>
<script>
(async () => {
  const F = await Frame.init();
  const { D, S, el, ui } = F;
  const B = F.brand || {};
  F.set('violet', ui.violet || '#5a46fa');
  F.set('dim', ui.dim || 'rgba(255,255,255,.30)');
  F.set('line', ui.line || '#ececf0');

  // 매체가 판을 정한다 — 포티투닷은 (screen · one-line · print · 휠) 이라 기본이 표지다.
  const V = (D.variant || '').trim() || 'wheel';
  const sheet = el('section', 'sheet' + (V === 'wheel' ? ' cover' : ''));
  document.getElementById('root').append(sheet);

  // 원문에서 한 줄을 고른다 — 고르는 것이지 고치는 것이 아니다
  const pickLine = () => {
    const pool = [];
    S.tasks.forEach(t => (t.items || []).forEach(x => pool.push(['주요업무', typeof x === 'string' ? x : x.text])));
    (S.qualifications || []).forEach(x => pool.push(['자격요건', typeof x === 'string' ? x : x.text]));
    const ok = pool.filter(([, s]) => !/^[[*]/.test(s) && s.length >= 20 && s.length <= 78);
    return (ok.length ? ok : pool)[0] || ['', ''];
  };

  if (V === 'wheel') {
    const top = el('div', 'top');
    top.append(el('div', 'co', B.wordmark || D.company));
    if (B.about) top.append(el('div', 'ab', B.about));
    sheet.append(top);

    const [where, line] = pickLine();
    const wheel = el('div', 'wheel');
    // 코드표가 흐르다 42 에서 멈춘다. 멈춘 자리에 공고 한 줄이 매칭된 것처럼 들어온다.
    for (const code of [38, 39, 40, 41, 42, 43, 44, 45]) {
      const r = el('div', 'wrow' + (code === 42 ? ' on' : ''));
      if (code === 42) {
        r.append(el('span', 'n', '42'), el('span', 'ast', '*'), el('span', 'match', line));
      } else {
        r.append(el('span', '', 'Code'), el('span', 'n', String(code)),
                 el('span', '', String.fromCharCode(code)));
      }
      wheel.append(r);
    }
    sheet.append(wheel);

    const foot = el('div', 'foot');
    const left = el('div');
    left.append(el('div', 'role', D.title || D.role));
    left.append(el('div', 'meta', D.meta.join(' · ')));
    left.append(el('div', 'src', `${D.company} · ${where} 중에서`));
    foot.append(left, el('div', 'apply'));   // .apply 는 Frame.period 가 마감을 넣는 자리
    sheet.append(foot);

    // 고른 줄이 길수록 글자를 줄인다. 멈춘 줄은 다른 줄보다 커야 '여기서 멈췄다' 가 읽힌다.
    const n = line.length;
    F.set('MS', 3.4);
    F.set('LS', n <= 34 ? 3.4 : n <= 52 ? 2.9 : 2.5);
    Frame.fit(F, [{ columns: 1 }], () => true, { lo: 14, hi: 15 });
    window.__layout.variant = 'wheel';
    return;
  }

  // 머리 — 코드표 + 42 *
  const header = el('header');
  const code = el('div', 'code');
  // 원본 About 페이지의 기둥 2 그대로. 40~44 / ( ) * + ,
  [[40, '('], [41, ')'], [42, '*'], [43, '+'], [44, ',']].forEach(([n, ch]) => {
    const r = el('div', 'row' + (n === 42 ? ' on' : ''));
    r.append(el('span', '', 'Code'), el('span', '', String(n)), el('span', 'g', ch));
    code.append(r);
  });
  const hi = el('div', 'hi');
  hi.append(el('span', 'n', '42'), el('span', 'a', '*'));
  header.append(code, hi);
  if (ui.quote) header.append(el('div', 'wild', ui.quote));
  sheet.append(header);

  // 공고
  const bar = el('div', 'bar');
  bar.append(el('div', 'co', B.wordmark || D.company));
  if (B.about) bar.append(el('div', 'about', B.about));
  const car = el('div', 'career'); car.textContent = D.meta.join(' · ');
  bar.append(car);
  sheet.append(bar);

  sheet.append(el('h1', '', D.title || D.role));

  // 본문 + 레일. 레일은 머리에서 42 로 멈춘 코드표의 그 다음 칸들이다 — 45 부터 이어 간다.
  const body = el('div', 'body');
  const main = el('main');
  const rail = el('aside', 'rail');
  for (let code = 45; code <= 56; code++) {
    const r = el('b', '', String(code));
    r.append(el('i', '', String.fromCharCode(code)));
    rail.append(r);
  }
  body.append(main, rail);
  sheet.append(body);

  const footer = el('footer');
  const left = el('div');
  left.append(el('div', 'slogan', B.slogan || ''));
  if (D.stack.length) left.append(el('div', 'stack', [...new Set(D.stack)].join(' · ')));
  footer.append(left, el('div', 'apply'));   // .apply 는 Frame.period 가 마감을 넣는 자리
  sheet.append(footer);

  // 원문 → 섹션. 글자는 그대로, 'A: B' 는 A 만 굵게, '[..]' 는 소제목, '*' 로 시작하면 주석
  const txt = it => (typeof it === 'string' ? it : it.text);
  const item = s => {
    const d = el('div', 'it');
    const m = s.match(/^([^:：]{2,24})([:：]\s*)([\s\S]+)$/);
    if (m) d.append(el('b', '', m[1] + m[2].trimEnd()), document.createTextNode(' ' + m[3]));
    else d.textContent = s;
    return d;
  };
  const secs = [];
  const addSec = (title, items) => {
    if (!items.length) return;
    const s = el('div', 'sec'); s.append(el('h2', '', title));
    for (const raw of items) {
      const t = txt(raw);
      if (/^\[.+\]$/.test(t)) s.append(el('div', 'sub', t));
      else if (/^\*\s/.test(t)) s.append(el('div', 'note', t));
      else if (typeof raw !== 'string' && raw.label) {
        const d = el('div', 'it');
        d.append(el('b', '', raw.label + ' '), document.createTextNode(raw.text));
        s.append(d);
      } else s.append(item(t));
    }
    secs.push(s);
  };
  S.tasks.forEach(t => addSec(t.title || '주요업무', t.items));
  addSec('자격요건', S.qualifications);
  addSec('우대사항', S.preferences);
  addSec('복지', S.benefits);
  main.append(...secs);

  // 머리 크기 후보. 코드표가 크면 장치가 살지만 본문이 작아진다 — 16px 아래로 안 떨어지는 가장 큰 머리.
  // H 머리 높이, CS 코드표 글자, CG 줄 간격, NS 42 크기, TS 제목 (모두 u)
  const heads = [
    { H: 40, CS: 3.1, CG: 1.9, NS: 11.5, TS: 5.9 },
    { H: 35, CS: 2.8, CG: 1.6, NS: 10.0, TS: 5.5 },
    { H: 30, CS: 2.4, CG: 1.3, NS: 8.6, TS: 5.1 },
    { H: 26, CS: 2.1, CG: 1.1, NS: 7.4, TS: 4.8 },
  ];
  const draw = c => {
    F.set('H', `calc(${c.H}*var(--u))`);
    F.set('CS', c.CS); F.set('CG', c.CG); F.set('NS', c.NS); F.set('TS', c.TS);
    main.style.columnCount = c.columns;
    return !Frame.overflows(main);
  };
  const MIN = 16.2;
  for (const h of heads) {
    Frame.fit(F, [{ ...h, columns: 1 }, { ...h, columns: 2 }], draw, { lo: 10, hi: 30 });
    window.__layout.head = h;
    if (window.__layout.font_px >= MIN || h === heads[heads.length - 1]) break;
  }
})();
</script>
