<!-- brand_tossplace — 토스플레이스 전용 판 v1. brands/토스플레이스.json 의 signature 를 판의 얼굴로 쓴다.
     signature  front2-standing-screen  카운터에 세로로 선 토스 프론트 2 의 7인치 화면.
                                        판이 그 화면이다 — 검은 하우징이 판을 두르고, 공고는 유리면 안에만 있다.
                                        위 정중앙 카메라 눈 하나, 아래 가로 카드 삽입구 한 줄. 실루엣은 이 셋뿐.
     supporting front-nfc-face          전면 유리가 곧 NFC 면 — 카드 삽입구 한 줄로만 남긴다. 손·카드는 안 그린다.
                black-housing           공식 하우징 색은 화이트/블랙 둘뿐. 기본은 2세대에서 더해진 블랙.
     안 쓰는 것: 토스 로고·심볼(로고 규정), 토스 파랑 면(토스 판 것), Toss Product Sans(전용),
                 페이스페이의 얼굴(실존 인물), 수치 카드(v0 실패), 제품 모양 SVG 장식(v0 가 그걸로 죽었다)
     글자: 공고 원문 + 회사가 쓴 문장만. '고객이 보는 단말기'(공식 브로슈어 3쪽 제목),
           '요즘 매장, 요즘 결제'(공식 슬로건). 지어낸 카피 없음.
     서체: Pretendard(OFL) — 전용 서체가 없고, 토스 판의 Wanted Sans 와 겹치지 않으려고 고른 것 -->
<meta charset="utf-8">
<title>brand_tossplace</title>
<style>
  /*__FONTS__*/
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#000}
  body{-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word}

  /* 판 = 단말기. 바깥은 하우징, 안은 유리 화면 */
  .sheet{position:relative;width:var(--w);height:var(--h);background:var(--shell);color:var(--ink);
    font-family:var(--font);display:flex;flex-direction:column;overflow:hidden;
    font-variant-numeric:tabular-nums}

  /* 하우징 위쪽 — 카메라 눈 하나. 스펙은 2개지만 눈에 보이는 건 하나다 */
  .brow{flex:none;height:var(--BROW);display:flex;align-items:center;justify-content:center;position:relative}
  .eye{width:calc(1.15*var(--u));height:calc(1.15*var(--u));border-radius:50%;
    background:radial-gradient(circle at 38% 32%,#3a4351 0,#11151c 62%,#05070a 100%);
    box-shadow:0 0 0 calc(.16*var(--u)) rgba(255,255,255,.045)}

  /* 유리면 — 공고는 전부 이 안에 있다 */
  .glass{flex:1;min-height:0;margin:0 var(--SIDE);border-radius:calc(1.1*var(--u));
    background:var(--paper);color:var(--text);overflow:hidden;display:flex;flex-direction:column;
    padding:calc(3.4*var(--u)) calc(3.4*var(--u)) calc(2.6*var(--u));
    box-shadow:0 0 0 1px var(--glass-edge), 0 calc(.5*var(--u)) calc(2*var(--u)) rgba(0,0,0,.45)}

  /* 화면 머리 */
  .bar{flex:none;display:flex;align-items:baseline;gap:calc(1.2*var(--u));
    padding-bottom:calc(1.2*var(--u));border-bottom:1px solid var(--line)}
  .co{font-size:calc(2.4*var(--u));font-weight:700;letter-spacing:-.02em;color:var(--ink)}
  .quote{font-size:calc(1.55*var(--u));font-weight:500;color:var(--sub);letter-spacing:-.01em}
  .career{margin-left:auto;font-size:calc(1.7*var(--u));font-weight:600;color:var(--accent);white-space:nowrap}

  h1{flex:none;margin:calc(1.9*var(--u)) 0 calc(1.7*var(--u));
    font-size:calc(var(--TS)*var(--u));font-weight:800;letter-spacing:-.035em;line-height:1.06;color:var(--ink);text-wrap:balance}

  /* 본문 — 원문 순서대로 흘린다. 오른쪽 레일은 안드로이드 화면의 스크롤 막대다
     (프론트 2 는 Android 위에서 돈다) — 새 장치가 아니라 '이것이 화면'이라는 시그니처의 연장. */
  .body{flex:1;min-height:0;display:flex;gap:calc(1.4*var(--u))}
  main{flex:1;min-width:0;min-height:0;overflow:hidden;column-gap:calc(var(--f)*1.6);column-fill:auto}
  .rail{flex:none;width:calc(.55*var(--u));background:var(--line);border-radius:99px;position:relative}
  .rail i{position:absolute;left:0;right:0;top:4%;height:42%;background:var(--sub);border-radius:99px}
  .sec{break-inside:auto}
  .sec + .sec{margin-top:calc(var(--f)*.85)}
  h2{break-after:avoid;font-size:calc(var(--f)*.86);font-weight:700;color:var(--sub);letter-spacing:.06em;
    text-transform:uppercase;margin-bottom:calc(var(--f)*.5)}
  .it{break-inside:avoid;position:relative;font-size:var(--f);line-height:1.5;color:var(--text);
    padding-left:calc(var(--f)*.95);margin-bottom:calc(var(--f)*.34);text-wrap:pretty}
  .it::before{content:'';position:absolute;left:0;top:calc(var(--f)*.68);
    width:calc(var(--f)*.34);height:1.5px;background:var(--sub);opacity:.7}
  .it b{font-weight:600;color:var(--ink)}
  .sub{break-after:avoid;font-size:calc(var(--f)*.94);font-weight:700;color:var(--ink);
    margin:calc(var(--f)*.6) 0 calc(var(--f)*.28)}
  .sub:first-of-type{margin-top:0}
  .note{break-inside:avoid;font-size:calc(var(--f)*.82);line-height:1.45;color:var(--sub);margin-top:calc(var(--f)*.28)}

  /* 화면 꼬리 — 회사가 쓴 문장 그대로 */
  .foot{flex:none;margin-top:calc(1.6*var(--u));padding-top:calc(1.3*var(--u));border-top:1px solid var(--line);
    display:flex;justify-content:space-between;align-items:flex-end;gap:calc(2*var(--u))}
  .slogan{font-size:calc(2.05*var(--u));font-weight:700;letter-spacing:-.025em;color:var(--ink);white-space:nowrap}
  .stack{margin-top:calc(.35*var(--u));font-size:calc(1.45*var(--u));font-weight:500;color:var(--sub)}
  .apply{text-align:right;white-space:nowrap;color:var(--accent)}

  /* 하우징 아래 — 카드 삽입구 한 줄. 카드도 손도 그리지 않는다 */
  .chin{flex:none;height:var(--CHIN);display:flex;align-items:center;justify-content:center}
  .slot{width:calc(42*var(--u));height:calc(.95*var(--u));border-radius:calc(.5*var(--u));
    background:linear-gradient(180deg,#05070a 0,#0d1117 55%,#232b36 100%);
    box-shadow:inset 0 calc(.18*var(--u)) calc(.3*var(--u)) rgba(0,0,0,.9), 0 1px 0 rgba(255,255,255,.05)}
</style>
<div id="root"></div>
<script id="data" type="application/json">/*__DATA__*/</script>
<script>/*__FRAME_JS__*/</script>
<script>
(async () => {
  const F = await Frame.init();
  const { D, S, el, ui } = F;
  const B = F.brand || {};
  F.set('shell', ui.shell || '#191f28');
  F.set('glass-edge', ui.glass_edge || '#f2f4f6');
  F.set('line', ui.line || '#e5e8eb');

  const sheet = el('section', 'sheet'); document.getElementById('root').append(sheet);

  // 하우징 위 — 카메라 눈
  const brow = el('div', 'brow'); brow.append(el('div', 'eye')); sheet.append(brow);

  // 유리 화면
  const glass = el('div', 'glass'); sheet.append(glass);
  const bar = el('div', 'bar');
  bar.append(el('div', 'co', B.wordmark || D.company));
  if (ui.quote) bar.append(el('div', 'quote', ui.quote));
  const car = el('div', 'career'); car.textContent = D.meta.join(' · ');
  bar.append(car);
  glass.append(bar);

  const h1 = el('h1', '', D.title || D.role); glass.append(h1);

  // 본문 + 스크롤 막대. 화면이라는 사실을 판 안쪽에서 한 번 더 말한다.
  const body = el('div', 'body');
  const main = el('main');
  const rail = el('aside', 'rail');
  rail.append(el('i'));
  body.append(main, rail);
  glass.append(body);

  const foot = el('div', 'foot');
  const left = el('div');
  left.append(el('div', 'slogan', B.slogan || ''));
  if (D.stack.length) left.append(el('div', 'stack', [...new Set(D.stack)].join(' · ')));
  foot.append(left, el('div', 'apply'));   // .apply 는 Frame.period 가 마감을 넣는 자리
  glass.append(foot);

  // 하우징 아래 — 카드 삽입구
  const chin = el('div', 'chin'); chin.append(el('div', 'slot')); sheet.append(chin);

  // 원문 → 섹션. 글자는 그대로, 'A: B' 는 A 만 굵게, '[..]' 는 소제목, '*' 로 시작하면 주석
  const txt = it => (typeof it === 'string' ? it : it.text);
  const item = s => {
    const d = el('div', 'it');
    const m = s.match(/^([^:：]{2,24})([:：]\s*)([\s\S]+)$/);
    if (m) d.append(el('b', '', m[1] + m[2].trimEnd()), document.createTextNode(' ' + m[3]));
    else d.textContent = s;
    return d;
  };
  const secs = [];
  const addSec = (title, items) => {
    if (!items.length) return;
    const s = el('div', 'sec'); s.append(el('h2', '', title));
    for (const raw of items) {
      const t = txt(raw);
      if (/^\[.+\]$/.test(t)) s.append(el('div', 'sub', t));
      else if (/^\*\s/.test(t)) s.append(el('div', 'note', t));
      else if (typeof raw !== 'string' && raw.label) {
        const d = el('div', 'it');
        d.append(el('b', '', raw.label + ' '), document.createTextNode(raw.text));
        s.append(d);
      } else s.append(item(t));
    }
    secs.push(s);
  };
  S.tasks.forEach(t => addSec(t.title || '주요업무', t.items));
  addSec('자격요건', S.qualifications);
  addSec('우대사항', S.preferences);
  addSec('복지', S.benefits);
  main.append(...secs);

  // 하우징 두께 후보. 두꺼우면 기기답지만 화면이 좁아진다 — 본문이 16px 아래로 떨어지지 않는 가장 두꺼운 것.
  // BROW 위 이마, CHIN 아래 턱, SIDE 옆 테, TS 제목 (모두 u)
  const shells = [
    { BROW: 7.0, CHIN: 8.4, SIDE: 4.6, TS: 6.4 },
    { BROW: 6.0, CHIN: 7.2, SIDE: 3.9, TS: 5.9 },
    { BROW: 5.1, CHIN: 6.1, SIDE: 3.3, TS: 5.4 },
    { BROW: 4.3, CHIN: 5.1, SIDE: 2.8, TS: 5.0 },
  ];
  const draw = c => {
    F.set('BROW', `calc(${c.BROW}*var(--u))`);
    F.set('CHIN', `calc(${c.CHIN}*var(--u))`);
    F.set('SIDE', `calc(${c.SIDE}*var(--u))`);
    F.set('TS', c.TS);
    main.style.columnCount = c.columns;
    return !Frame.overflows(main);
  };
  const MIN = 16.2;
  for (const s of shells) {
    // 한 단이 읽기 좋지만 글이 많으면 두 단으로 — 둘 다 재고 글자가 큰 쪽이 이긴다
    Frame.fit(F, [{ ...s, columns: 1 }, { ...s, columns: 2 }], draw, { lo: 10, hi: 30 });
    window.__layout.shell = s;
    if (window.__layout.font_px >= MIN || s === shells[shells.length - 1]) break;
  }
})();
</script>
