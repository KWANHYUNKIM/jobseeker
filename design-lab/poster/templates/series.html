<!doctype html>
<!-- 시리즈 판 한 장 — 데이터로 본 채용 · 들어가려면(취업 가이드) · 회사 해부 표지.
     poster/series.py 가 /*__DATA__*/ 자리에 {theme, series, page, slide} 를 박고 .sheet 를 찍는다.

     규칙(CONTENT_PLAN.md · BRAND_RESEARCH.md 0절):
       - 숫자는 우리 데이터에서 센 것만. 모든 수치 판은 기준일과 표본 수(n)를 판 안에 적는다.
       - 장식 없음 — 알약 칩·강조 막대 달린 수치 카드·색 네모 불릿·그림자 금지. 강조색은 한 곳.
       - 시리즈 이름은 대괄호 머리말([데이터로 본 채용])로 — 틀은 같고 주제만 바뀐다.
       - 본문 18px 이상(1080 폭). 채용 사이트 이름·공고 주소는 판에 넣지 않는다. -->
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  :root { --paper:#f5f2ea; --ink:#111317; --sub:#5d6068; --accent:#ff5a1f; --line:#d8d3c7; }
  * { box-sizing:border-box; margin:0; }
  body { background:#222; }
  .sheet { width:var(--sheet-w,1080px); height:var(--sheet-h,1350px); background:var(--paper); color:var(--ink);
           font-family:'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif; padding:84px 80px 70px;
           display:flex; flex-direction:column; position:relative; overflow:hidden; -webkit-font-smoothing:antialiased; }
  .mono { font-family:'JetBrains Mono',ui-monospace,Consolas,Menlo,monospace; }
  .series { font-size:28px; font-weight:800; letter-spacing:-.01em; }
  .series b { color:var(--accent); }
  .rule { height:5px; background:var(--ink); margin-top:22px; }
  h1 { font-weight:800; letter-spacing:-.045em; line-height:1.06; }
  h2 { font-size:64px; font-weight:800; letter-spacing:-.04em; line-height:1.1; margin-top:40px; }
  .sub { margin-top:20px; font-size:30px; color:var(--sub); font-weight:600; line-height:1.4; }
  .note { margin-top:auto; padding-top:18px; font-size:19px; color:var(--sub); line-height:1.45; font-weight:500; }
  footer { margin-top:18px; padding-top:18px; border-top:2px solid var(--ink); display:flex; justify-content:space-between;
           font-size:22px; font-weight:700; }
  footer .pg { color:var(--sub); font-variant-numeric:tabular-nums; }
  em { font-style:normal; color:var(--accent); }

  /* cover */
  .cover h1 { margin-top:auto; font-size:132px; }
  .cover h1 div { white-space:nowrap; }
  .cover .sub { font-size:34px; margin-top:28px; }
  .cover .big { font-size:260px; font-weight:800; letter-spacing:-.06em; line-height:.9; color:var(--accent);
                font-variant-numeric:tabular-nums; margin-top:60px; }
  .cover .big small { font-size:64px; letter-spacing:-.02em; color:var(--ink); margin-left:10px; }

  /* bars */
  .bars { margin-top:48px; display:flex; flex-direction:column; gap:16px; }
  .bar { display:grid; grid-template-columns:230px 1fr 110px; align-items:center; gap:18px; }
  .bar .l { font-size:34px; font-weight:800; letter-spacing:-.02em; text-align:right; white-space:nowrap; }
  .bar .t { height:40px; background:var(--line); }
  .bar .t i { display:block; height:100%; background:var(--ink); }
  .bar.hi .t i { background:var(--accent); }
  .bar .v { font-size:30px; font-weight:800; font-variant-numeric:tabular-nums; }
  .bar .v small { font-size:18px; color:var(--sub); font-weight:600; margin-left:4px; }

  /* table */
  table { width:100%; border-collapse:collapse; margin-top:44px; }
  th { text-align:left; font-size:24px; color:var(--sub); font-weight:700; padding:0 0 14px; border-bottom:3px solid var(--ink); }
  td { font-size:42px; font-weight:800; padding:34px 0; border-bottom:1px solid var(--line); letter-spacing:-.02em;
       font-variant-numeric:tabular-nums; }
  th.r, td.r { text-align:right; }
  td small { font-size:24px; color:var(--sub); font-weight:600; margin-left:6px; }
  td.hi { color:var(--accent); }

  /* stat */
  .stat .num { margin-top:110px; font-size:300px; font-weight:800; letter-spacing:-.06em; line-height:.9; color:var(--accent);
               font-variant-numeric:tabular-nums; }
  .stat .num small { font-size:70px; color:var(--ink); }
  .stat .lab { margin-top:40px; font-size:52px; font-weight:800; letter-spacing:-.03em; line-height:1.3; }
  .stat .exp { margin-top:34px; font-size:36px; color:var(--sub); line-height:1.5; font-weight:600; }

  /* guide item */
  .gi .no { margin-top:44px; font-size:30px; font-weight:800; color:var(--accent); font-variant-numeric:tabular-nums; }
  .gi h2 { margin-top:12px; font-size:58px; }
  .gi blockquote { margin-top:36px; padding:26px 0 26px 30px; border-left:6px solid var(--accent);
                   font-size:26px; line-height:1.5; font-weight:600; }
  .gi blockquote small { display:block; font-size:18px; color:var(--sub); margin-bottom:10px; font-weight:700; }
  .gi .why { margin-top:32px; font-size:28px; line-height:1.6; font-weight:500; }
  .gi .chk { margin-top:30px; padding-top:22px; border-top:2px solid var(--line); font-size:27px; line-height:1.55; font-weight:700; }
  .gi .chk small { display:block; font-size:19px; color:var(--sub); margin-bottom:8px; }

  /* jobs list */
  .jobs { margin-top:40px; }
  .jobs li { list-style:none; display:grid; grid-template-columns:60px 1fr auto; gap:14px; align-items:baseline;
             padding:18px 0; border-bottom:1px solid var(--line); }
  .jobs .n { font-size:22px; color:var(--sub); font-weight:800; font-variant-numeric:tabular-nums; }
  .jobs .r { font-size:32px; font-weight:800; letter-spacing:-.02em; line-height:1.25; }
  .jobs .c { font-size:22px; color:var(--sub); font-weight:600; white-space:nowrap; }

  /* end */
  .end h2 { margin-top:auto; font-size:88px; }
  .end ul { margin-top:34px; padding:0; }
  .end li { list-style:none; font-size:40px; font-weight:700; line-height:1.45; padding:24px 0; border-bottom:1px solid var(--line); }

  /* photo — 사진이 판 전체를 덮고 글은 아래 어두운 띠 위에. 사진 출처(작가·라이선스)는 늘 판 안에 적는다 */
  .photo { color:#fff; }
  .photo .bg { position:absolute; inset:0; background-size:cover; background-position:center; }
  .photo .shade { position:absolute; inset:0; background:linear-gradient(180deg, rgba(0,0,0,.55) 0%, rgba(0,0,0,.18) 22%,
                  rgba(0,0,0,.35) 36%, rgba(0,0,0,.78) 52%, rgba(0,0,0,.9) 100%); }
  .photo > *:not(.bg):not(.shade) { position:relative; text-shadow:0 2px 12px rgba(0,0,0,.55); }
  .photo h2 { margin-top:auto !important; }
  .photo .rank + h2 { margin-top:10px !important; }
  .photo .series, .photo footer { color:#fff; }
  .photo .rule { background:#fff; }
  .photo footer { border-top-color:#fff; }
  .photo footer .pg, .photo .note { color:rgba(255,255,255,.75); }
  .photo .rank { margin-top:auto; font-size:34px; font-weight:800; color:var(--accent); font-variant-numeric:tabular-nums; }
  .photo h2 { margin-top:10px; font-size:84px; color:#fff; }
  .photo .meta { margin-top:18px; font-size:32px; font-weight:700; color:rgba(255,255,255,.9); line-height:1.4; }
  .photo ul { margin-top:22px; padding:0; }
  .photo li { list-style:none; font-size:30px; font-weight:600; line-height:1.5; color:rgba(255,255,255,.92); }
  .photo .credit { margin-top:20px; font-size:18px; color:rgba(255,255,255,.7); font-weight:500; }
  /* photo.split — 물건 사진(키트)은 덮어 가리면 안 보인다: 사진은 위 58% 에 그대로, 글은 아래 어두운 판에 */
  .photo { --accent:var(--photo-accent, var(--accent-base)); }
  .photo.split { background:#141218; }
  .photo.split .bg { bottom:auto; height:58%; }
  .photo.split footer { margin-top:36px !important; }   /* 글은 아래 판으로 — 사진 위에 얹히지 않게 */
  .photo.split .shade { background:linear-gradient(180deg, rgba(0,0,0,.55) 0%, rgba(0,0,0,0) 13%, rgba(0,0,0,0) 46%,
                        #141218 58%, #141218 100%); }

  /* reel(9:16) — 위 250px·아래 420px 는 릴스 화면의 이름·캡션·버튼이 덮는다. 본문은 가운데로 */
  .sheet.reel { padding:230px 96px 400px; }
  .reel.bars .bars, .reel.table table, .reel.jobs .jobs, .reel.end ul, .reel.stat .num { margin-top:auto; }
  .reel.end h2 { margin-top:auto; }
  .reel.end ul { margin-top:34px; }
  .reel .note { margin-top:auto; }
  .reel.photo { padding-bottom:420px; }

  /* brand cover (회사 해부) — 바탕이 그 회사의 색이다 */
  .brand .co { margin-top:auto; font-size:190px; font-weight:800; letter-spacing:-.06em; line-height:.95; white-space:nowrap; }
  .brand .one { margin-top:34px; font-size:36px; font-weight:700; line-height:1.45; letter-spacing:-.02em; }
  .brand .cnt { margin-top:30px; font-size:40px; font-weight:800; }

  /* mag — 큰 채용 계정(캐치·링커리어·공취사, 10만+)식 사진 판: 흐린 사진 바탕 + 선명한 사진 + 노란 꼬리표
     + 굵은 흰 제목 2줄(핵심어 하나만 노랑) + 짧은 줄 몇 개. 사진은 자르지 않고 폭에 맞춘다(물건이 잘리면 안 된다) */
  .mag { padding:0; color:#fff; background:#0d0c10; }
  .mag .blur { position:absolute; inset:-80px; background-size:cover; background-position:center;
               filter:blur(48px) brightness(.38) saturate(1.25); }
  .mag .pic { position:absolute; left:0; right:0; background-size:cover; background-position:center;
              -webkit-mask-image:linear-gradient(180deg, transparent 0, #000 9%, #000 78%, transparent 100%); }
  .mag .top { position:absolute; left:64px; right:64px; display:flex; justify-content:space-between; align-items:center;
              font-size:26px; font-weight:800; text-shadow:0 2px 10px rgba(0,0,0,.6); }
  .mag .top b { color:var(--hi); }
  .mag .top .h { font-weight:700; opacity:.85; }
  .mag .txt { position:absolute; left:64px; right:64px; display:flex; flex-direction:column; }
  .mag .tag { align-self:flex-start; background:var(--hi); color:#141218; font-size:30px; font-weight:900;
              padding:8px 22px; border-radius:999px; letter-spacing:-.01em; }
  .mag .hd { margin-top:18px; font-size:92px; font-weight:900; letter-spacing:-.05em; line-height:1.1;
             text-shadow:0 4px 24px rgba(0,0,0,.45); }
  .mag .hd div { white-space:nowrap; }
  .mag em { color:var(--hi); }
  .mag .sb { margin-top:18px; font-size:34px; font-weight:700; color:rgba(255,255,255,.88); line-height:1.4; }
  .mag ul { margin-top:26px; padding:0; }
  .mag li { list-style:none; display:flex; gap:18px; align-items:baseline; padding:13px 0;
            border-top:1px solid rgba(255,255,255,.16); font-size:32px; line-height:1.3; }
  .mag li .co { flex:none; font-weight:900; color:#fff; }
  .mag li .it { color:rgba(255,255,255,.78); font-weight:600; }
  .mag li.solo { display:block; font-weight:700; color:rgba(255,255,255,.92); }
  .mag .cr { margin-top:18px; font-size:19px; color:rgba(255,255,255,.55); font-weight:500; }
  .mag .topshade { position:absolute; left:0; right:0; top:0; height:220px; background:linear-gradient(180deg, rgba(0,0,0,.5), rgba(0,0,0,0)); }
  .mag .grid { position:absolute; left:64px; right:64px; display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
  .mag .grid div { position:relative; aspect-ratio:4/3; border-radius:14px; background-size:cover; background-position:center; overflow:hidden; }
  .mag .grid span { position:absolute; left:10px; bottom:10px; background:var(--hi); color:#141218; font-size:22px; font-weight:900; padding:3px 12px; border-radius:999px; }
  /* vs — 둘 중 하나(밸런스 게임). 위 A · 아래 B 사진, 가운데 VS. 질문은 맨 위, 고르는 건 댓글로 */
  .vs .half { position:absolute; left:0; right:0; height:50%; background-size:cover; background-position:center; }
  .vs .half::after { content:''; position:absolute; inset:0; background:linear-gradient(180deg, rgba(0,0,0,.15), rgba(0,0,0,.62)); }
  .vs .half.a { top:0; } .vs .half.b { top:50%; }
  .vs .lab { position:absolute; left:64px; right:64px; z-index:2; text-shadow:0 3px 16px rgba(0,0,0,.6); }
  .vs .lab .k { display:inline-block; background:var(--hi); color:#141218; font-size:40px; font-weight:900; width:64px; height:64px;
                border-radius:16px; text-align:center; line-height:64px; margin-right:16px; vertical-align:middle; }
  .vs .lab .t { font-size:66px; font-weight:900; letter-spacing:-.04em; vertical-align:middle; }
  .vs .lab .d { margin-top:12px; font-size:36px; font-weight:800; color:#fff; line-height:1.35; }
  .vs .lab .d em { color:var(--hi); }
  .vs .badge { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); z-index:3; width:150px; height:150px;
               border-radius:50%; background:#141218; border:8px solid var(--hi); color:var(--hi); font-size:60px; font-weight:900;
               display:flex; align-items:center; justify-content:center; letter-spacing:-.04em; }
  .vs .q { position:absolute; left:64px; right:64px; z-index:2; font-size:80px; font-weight:900; letter-spacing:-.05em; line-height:1.1;
           text-shadow:0 4px 24px rgba(0,0,0,.6); }
  .vs .q em { color:var(--hi); }
  .vs .cr2 { position:absolute; left:64px; right:64px; z-index:2; font-size:18px; color:rgba(255,255,255,.6); }
  /* tier — 티어표 한 장(5~8초 릴스). 맨 위 칸은 가려 두고 댓글로 맞히게 한다 */
  .tier .tt { position:absolute; left:64px; right:64px; font-size:84px; font-weight:900; letter-spacing:-.05em; line-height:1.1; }
  .tier .tt em { color:var(--hi); }
  .tier .ts { position:absolute; left:64px; right:64px; font-size:30px; font-weight:700; color:rgba(255,255,255,.75); }
  .tier .rows { position:absolute; left:48px; right:48px; display:flex; flex-direction:column; gap:12px; }
  .tier .row { display:flex; align-items:stretch; border-radius:18px; overflow:hidden; background:rgba(255,255,255,.07); min-height:120px; }
  .tier .row .g { flex:none; width:128px; display:flex; flex-direction:column; align-items:center; justify-content:center;
                  font-size:68px; font-weight:900; color:#141218; }
  .tier .row .g small { font-size:19px; font-weight:800; margin-top:2px; }
  .tier .row .c { flex:1; padding:18px 24px; display:flex; flex-direction:column; justify-content:center; font-size:32px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
                  line-height:1.3; color:#fff; }
  .tier .row .c .n { font-size:22px; font-weight:700; color:rgba(255,255,255,.6); margin-top:6px; }
  .tier .row.hide .c { border:4px dashed var(--hi); border-left:0; border-radius:0 18px 18px 0; color:var(--hi); font-size:46px; letter-spacing:.1em; }
  .tier .row.hl { outline:5px solid var(--hi); outline-offset:-5px; }
  .tier .row.hl .c { color:var(--hi); }
  .tier .ft { position:absolute; left:64px; right:64px; font-size:19px; color:rgba(255,255,255,.55); line-height:1.4; }
  .mag .pg { position:absolute; right:64px; font-size:22px; font-weight:700; opacity:.6; }
</style>
</head>
<body>
<div id="root"></div>
<script id="data" type="application/json">/*__DATA__*/</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
(function () {
  const el = (t, c, x) => { const n = document.createElement(t); if (c) n.className = c; if (x != null) n.textContent = x; return n; };
  const T = D.theme || {};
  const root = document.documentElement;
  for (const k of ['paper','ink','sub','accent','line']) if (T[k]) root.style.setProperty('--' + k, T[k]);
  root.style.setProperty('--accent-base', T.accent || getComputedStyle(root).getPropertyValue('--accent'));
  if (T.photo_accent) root.style.setProperty('--photo-accent', T.photo_accent);   // 사진 위에서는 밝은 강조색
  if (D.size) { root.style.setProperty('--sheet-w', D.size[0] + 'px'); root.style.setProperty('--sheet-h', D.size[1] + 'px'); }
  const S = D.slide; const sheet = el('section', 'sheet ' + S.type + (S.layout ? ' ' + S.layout : '') + (D.size && D.size[1] > 1500 ? ' reel' : ''));


  if (S.type === 'mag') {   // 머리·줄·바닥글을 쓰지 않는 판 — 따로 그리고 끝낸다
    if (S.tiers) {   // 티어표 한 장
      sheet.classList.add('tier'); sheet.style.setProperty('--hi', (D.theme && D.theme.hi) || '#ffe066');
      const em3 = (node, t) => { String(t || '').split(/(\*\*[^*]+\*\*)/).forEach(p =>
        node.append(p.startsWith('**') ? el('em', '', p.slice(2, -2)) : p)); return node; };
      const st3 = (D.size || [1080, 1350])[1] > 1500;
      const blur = el('div', 'blur'); if (S.image) blur.style.backgroundImage = `url("${S.image}")`; sheet.append(blur);
      const top3 = el('div', 'top'); top3.style.top = (st3 ? 150 : 52) + 'px'; const tl3 = el('div'); const m3 = (D.series || '').match(/^\[(.+)\]/);
      tl3.append('[', el('b', '', m3 ? m3[1] : D.series), ']'); top3.append(tl3, el('div', 'h', '@devjobseeker')); sheet.append(top3);
      const tt = el('div', 'tt'); (S.head || []).forEach(l => tt.append(em3(el('div'), l))); tt.style.top = (st3 ? 230 : 110) + 'px'; sheet.append(tt);
      if (S.sub) { const ts = el('div', 'ts', S.sub); ts.style.top = (st3 ? 440 : 310) + 'px'; sheet.append(ts); }
      const COL = ['#ffe066', '#ffb36b', '#9be38a', '#7cc7ff', '#c4a8ff', '#b9b4c7'];
      const rows = el('div', 'rows'); rows.style.top = (st3 ? 510 : 370) + 'px';
      S.tiers.forEach((t, i) => {
        const r = el('div', 'row' + (t.hide ? ' hide' : '') + (t.hl ? ' hl' : '')); if (S.rowh) r.style.minHeight = S.rowh + 'px'; const g = el('div', 'g', t.g); g.style.background = COL[i % COL.length];
        g.append(el('small', '', t.range)); const c = el('div', 'c', t.hide ? '? ? ?' : t.names);
        c.append(el('div', 'n', t.note)); r.append(g, c); rows.append(r);
      });
      sheet.append(rows);
      if (S.foot) { const ft = el('div', 'ft', S.foot); ft.style.bottom = (st3 ? 430 : 40) + 'px'; sheet.append(ft); }
      document.getElementById('root').append(sheet);
      const rb = rows.getBoundingClientRect(), fb = sheet.querySelector('.ft')?.getBoundingClientRect();
      window.__overflow = !!(fb && rb.bottom > fb.top - 8); window.__minBody = 22; window.__ready = true; return;
    }
    if (S.vs) {   // 둘 중 하나: 위 A · 아래 B
      sheet.classList.add('vs'); sheet.style.setProperty('--hi', (D.theme && D.theme.hi) || '#ffe066');
      const em2 = (node, t) => { String(t || '').split(/(\*\*[^*]+\*\*)/).forEach(p =>
        node.append(p.startsWith('**') ? el('em', '', p.slice(2, -2)) : p)); return node; };
      const Hh2 = (D.size || [1080, 1350])[1], st = Hh2 > 1500;
      S.vs.forEach((v, i) => {
        const h = el('div', 'half ' + (i ? 'b' : 'a')); h.style.backgroundImage = `url("${v.image}")`; sheet.append(h);
        const lab = el('div', 'lab'); const top = el('div'); top.append(el('span', 'k', i ? 'B' : 'A'), el('span', 't', v.title));
        lab.append(top); (v.lines || []).forEach(l => lab.append(em2(el('div', 'd'), l)));
        lab.style.bottom = i ? (st ? '480px' : '90px') : 'calc(50% + 100px)'; sheet.append(lab);
      });
      sheet.append(el('div', 'badge', 'VS'));
      if (S.q) { const q = el('div', 'q'); S.q.forEach(l => q.append(em2(el('div'), l))); q.style.top = (st ? 230 : 110) + 'px'; sheet.append(q); }
      if (S.credit) { const c = el('div', 'cr2', S.credit); c.style.bottom = (st ? 410 : 24) + 'px'; sheet.append(c); }
      const top2 = el('div', 'top'); top2.style.top = (st ? 150 : 52) + 'px'; const tl2 = el('div'); const m2 = (D.series || '').match(/^\[(.+)\]/);
      tl2.append('[', el('b', '', m2 ? m2[1] : D.series), ']'); top2.append(tl2, el('div', 'h', '@devjobseeker')); sheet.append(top2);
      document.getElementById('root').append(sheet);
      window.__overflow = false; window.__minBody = 99; window.__ready = true; return;
    }
    const [W, Hh] = D.size || [1080, 1350];
    const story = Hh > 1500;
    sheet.style.setProperty('--hi', (D.theme && D.theme.hi) || '#ffe066');
    const em = (node, t) => { String(t || '').split(/(\*\*[^*]+\*\*)/).forEach(p =>
      node.append(p.startsWith('**') ? el('em', '', p.slice(2, -2)) : p)); return node; };
    const blur = el('div', 'blur'); blur.style.backgroundImage = `url("${S.image}")`; sheet.append(blur);
    if (S.pic !== false) {
      const pic = el('div', 'pic'); pic.style.backgroundImage = `url("${S.image}")`;
      const ph = Math.round(W / (S.ratio || 4 / 3));
      pic.style.top = (story ? 260 : 0) + 'px'; pic.style.height = ph + 'px'; sheet.append(pic);
    }
    if (S.grid) { const g = el('div', 'grid'); g.style.top = (story ? 330 : 140) + 'px';
      S.grid.forEach(([img, lab]) => { const c = el('div'); c.style.backgroundImage = `url("${img}")`; c.append(el('span', '', lab)); g.append(c); });
      sheet.append(g); }
    sheet.append(el('div', 'topshade'));
    const top = el('div', 'top'); top.style.top = (story ? 150 : 52) + 'px';
    const tl = el('div'); const m = (D.series || '').match(/^\[(.+)\]/);
    tl.append('[', el('b', '', m ? m[1] : D.series), ']'); top.append(tl, el('div', 'h', '@devjobseeker')); sheet.append(top);
    const txt = el('div', 'txt');
    // 사진·격자 없는 글 판은 위에서부터 — 아래로 붙이면 위 절반이 빈다
    if (S.pic === false && !S.grid) txt.style.top = (story ? 420 : 170) + 'px'; else txt.style.bottom = (story ? 400 : 84) + 'px';
    if (S.tag) txt.append(el('div', 'tag', S.tag));
    const hd = el('div', 'hd'); (S.head || []).forEach(l => hd.append(em(el('div'), l))); if (S.big) hd.style.fontSize = S.big + 'px';
    txt.append(hd);
    if (S.sub) txt.append(em(el('div', 'sb'), S.sub));
    if (S.rows || S.lines) {
      const ul = el('ul');
      (S.rows || []).forEach(r => { const li = el('li'); li.append(el('span', 'co', r[0]), em(el('span', 'it'), r[1])); ul.append(li); });
      (S.lines || []).forEach(l => ul.append(em(el('li', 'solo'), l)));
      txt.append(ul);
    }
    if (S.credit) txt.append(el('div', 'cr', S.credit));
    sheet.append(txt);
    if (D.page && !story) { const pg = el('div', 'pg', D.page); pg.style.top = '56px'; pg.style.display = 'none'; sheet.append(pg); }
    document.getElementById('root').append(sheet);
    sheet.querySelectorAll('.hd div').forEach(n => { let z = parseFloat(getComputedStyle(n).fontSize);
      while (z > 48 && n.scrollWidth > W - 128) { z -= 3; n.style.fontSize = z + 'px'; } });
    sheet.querySelectorAll('li').forEach(n => { let z = parseFloat(getComputedStyle(n).fontSize);
      while (z > 24 && n.scrollWidth > W - 128) { z -= 1; n.style.fontSize = z + 'px'; } });
    if (S.pic === false && !S.grid) {   // 글 판은 세로 가운데로 — 위·아래 여백을 맞춘다
      const safeTop = story ? 260 : 120, safeBot = story ? 440 : 60, h = txt.offsetHeight;
      txt.style.top = Math.max(safeTop, safeTop + (Hh - safeTop - safeBot - h) / 2) + 'px';
    }
    const r = txt.getBoundingClientRect();
    window.__overflow = r.top < (story ? 250 : 40);
    window.__minBody = Math.min(...[...sheet.querySelectorAll('li, .sb')].map(n => parseFloat(getComputedStyle(n).fontSize)).concat([99]));
    window.__ready = true;
    return;
  }
  const head = el('div', 'series');
  const m = (D.series || '').match(/^\[(.+)\]\s*(.*)$/);
  if (m) { head.append('['); head.append(el('b', '', m[1])); head.append('] ' + m[2]); } else head.append(D.series || '');
  sheet.append(head, el('div', 'rule'));

  const rich = (node, s) => {   // **강조** 만 받는다(가이드 원고의 표기)
    String(s || '').split(/(\*\*[^*]+\*\*)/).forEach(p => {
      if (p.startsWith('**')) node.append(el('em', '', p.slice(2, -2))); else if (p) node.append(p.replace(/`/g, ''));
    });
    return node;
  };

  if (S.type === 'cover') {
    if (S.big) { const b = el('div', 'big', S.big); if (S.big_unit) b.append(el('small', '', S.big_unit)); sheet.append(b); }
    const h = el('h1'); (S.lines || []).forEach(l => h.append(rich(el('div'), l))); sheet.append(h);
    if (S.sub) sheet.append(rich(el('div', 'sub'), S.sub));
  } else if (S.type === 'brand') {
    sheet.append(el('div', 'co', S.company));
    if (S.one) sheet.append(rich(el('div', 'one'), S.one));
    if (S.count) sheet.append(el('div', 'cnt', S.count));
  } else if (S.type === 'bars') {
    sheet.append(rich(el('h2'), S.title));
    if (S.sub) sheet.append(rich(el('div', 'sub'), S.sub));
    const box = el('div', 'bars'); const max = Math.max(...S.rows.map(r => r.value));
    S.rows.forEach((r, i) => {
      const row = el('div', 'bar' + (r.hi ? ' hi' : ''));
      const t = el('div', 't'); const f = el('i'); f.style.width = `${(100 * r.value / max).toFixed(1)}%`; t.append(f);
      const v = el('div', 'v', r.display || String(r.value)); if (r.unit) v.append(el('small', '', r.unit));
      row.append(el('div', 'l', r.label), t, v); box.append(row);
    });
    sheet.append(box);
  } else if (S.type === 'table') {
    sheet.append(rich(el('h2'), S.title));
    if (S.sub) sheet.append(rich(el('div', 'sub'), S.sub));
    const tb = el('table'); const hr = el('tr');
    S.head.forEach((h, i) => hr.append(el('th', i ? 'r' : '', h))); tb.append(hr);
    S.rows.forEach(r => { const tr = el('tr'); r.forEach((c, i) => {
      const td = el('td', (i ? 'r' : '') + (S.hi_col === i ? ' hi' : ''));
      if (typeof c === 'object' && c) { td.append(c.v); if (c.s) td.append(el('small', '', c.s)); } else td.append(c);
      tr.append(td); }); tb.append(tr); });
    sheet.append(tb);
  } else if (S.type === 'stat') {
    sheet.append(rich(el('h2'), S.title));
    const n = el('div', 'num', S.num); if (S.unit) n.append(el('small', '', S.unit)); sheet.append(n);
    sheet.append(rich(el('div', 'lab'), S.label));
    if (S.explain) sheet.append(rich(el('div', 'exp'), S.explain));
  } else if (S.type === 'gi') {
    sheet.append(el('div', 'no', S.no));
    sheet.append(rich(el('h2'), S.topic));
    if (S.quote) { const q = el('blockquote'); q.append(el('small', '', S.quote_label || '공고 원문')); q.append(S.quote); sheet.append(q); }
    if (S.why) sheet.append(rich(el('div', 'why'), S.why));
    if (S.check) { const c = el('div', 'chk'); c.append(el('small', '', S.check_label || '스스로 점검')); rich(c, S.check); sheet.append(c); }
  } else if (S.type === 'jobs') {
    sheet.append(rich(el('h2'), S.title));
    if (S.sub) sheet.append(rich(el('div', 'sub'), S.sub));
    const ol = el('ol', 'jobs'); ol.style.padding = 0;
    S.rows.forEach((r, i) => { const li = el('li');
      li.append(el('div', 'n', String(i + 1).padStart(2, '0')), el('div', 'r', r.role), el('div', 'c', r.meta || '')); ol.append(li); });
    sheet.append(ol);
  } else if (S.type === 'end') {
    sheet.append(rich(el('h2'), S.title));
    const ul = el('ul'); (S.lines || []).forEach(l => ul.append(rich(el('li'), l))); sheet.append(ul);
  } else if (S.type === 'photo') {
    const bg = el('div', 'bg'); bg.style.backgroundImage = `url("${S.image}")`;
    sheet.prepend(bg, el('div', 'shade'));
    if (S.rank) sheet.append(el('div', 'rank', S.rank));
    sheet.append(rich(el('h2'), S.title));
    if (S.meta) sheet.append(rich(el('div', 'meta'), S.meta));
    if (S.lines) { const ul = el('ul'); S.lines.forEach(l => ul.append(rich(el('li'), l))); sheet.append(ul); }
    if (S.credit) sheet.append(el('div', 'credit', S.credit));
  }
  if (S.note) sheet.append(el('div', 'note', S.note));
  const foot = el('footer'); foot.append(el('div', '', '@devjobseeker'), el('div', 'pg', D.page || ''));
  if (!S.note) foot.style.marginTop = 'auto';
  sheet.append(foot);
  document.getElementById('root').append(sheet);

  // 넘치면 큰 글자부터 줄인다
  const fitW = (sel, min) => sheet.querySelectorAll(sel).forEach(n => {
    let s = parseFloat(getComputedStyle(n).fontSize);
    while (s > min && n.scrollWidth > sheet.clientWidth - 160) { s -= 4; n.style.fontSize = s + 'px'; }
  });
  fitW('.cover h1 div', 60); fitW('.brand .co', 80);
  let guard = 0;
  while (sheet.scrollHeight > sheet.clientHeight + 1 && guard++ < 30) {
    sheet.querySelectorAll('h1, h2, .why, blockquote, .one, .jobs .r, .end li, td').forEach(n => {
      const s = parseFloat(getComputedStyle(n).fontSize); if (s > 20) n.style.fontSize = (s * 0.95) + 'px';
    });
  }
  window.__minBody = Math.min(...[...sheet.querySelectorAll('.why, blockquote, .jobs .r, .end li, td, .sub, .chk')]
    .map(n => parseFloat(getComputedStyle(n).fontSize)).concat([99]));
  window.__overflow = sheet.scrollHeight > sheet.clientHeight + 1;
  window.__ready = true;
})();
</script>
</body>
</html>
