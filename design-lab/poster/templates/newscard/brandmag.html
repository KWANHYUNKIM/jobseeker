<!doctype html>
<!-- 카드뉴스 틀: 회사 잡지. 한 장 = 한 회사. 그 장은 그 회사가 스스로 쓰는 색(brands/*.json 조사값)으로 칠하고,
     제목은 그 회사 서체로 그 회사가 자기를 부르는 한 문장(slogan)을 크게 — 잡지의 인용 제목처럼.
     대표 물건(signature 이미지)은 가로 사진이면 위쪽 띠(band), 물건이면 색 면 위에 하나(object).
     표지·끝 장은 잡지 표지 — 회사들의 이미지를 타일로, 차례에 회사 색 칩. -->
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  /*__FONTS__*/
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:#000; }
  .sheet { word-break:keep-all; width:var(--w); height:var(--h); position:relative; overflow:hidden; color:var(--ink); background:var(--bg);
           font-family:'Pretendard',sans-serif; display:flex; flex-direction:column; -webkit-font-smoothing:antialiased; }
  .pad { padding:0 76px; }
  .mast { display:flex; justify-content:space-between; align-items:baseline; padding:54px 76px 16px; font-size:21px;
          font-weight:700; letter-spacing:.16em; }
  .mast b { font-family:'NanumMyeongjo',serif; font-size:36px; letter-spacing:-.02em; font-weight:700; }
  .rule { height:2px; background:var(--ink); margin:0 76px; opacity:.85; }

  /* 회사 장 */
  .band { margin-top:28px; height:var(--band-h); background-size:cover; background-position:center; }
  .object { margin-top:28px; height:var(--obj-h); display:flex; align-items:center; justify-content:center; }
  .object img { max-height:100%; max-width:70%; }
  .object.tilt img { transform:rotate(-8deg); filter:drop-shadow(0 30px 40px rgba(0,0,0,.25)); }
  .who { display:flex; align-items:baseline; gap:18px; margin-top:34px; }
  .who .wm { font-family:var(--brand-font); font-weight:800; font-size:44px; letter-spacing:-.02em; }
  .who .ab { font-size:22px; font-weight:600; color:var(--sub); }
  .who i { display:inline-block; width:56px; height:6px; background:var(--accent); align-self:center; }
  .quote { font-family:var(--brand-font); font-weight:800; font-size:76px; line-height:1.16; letter-spacing:-.035em; margin-top:14px; }
  .jobs { margin-top:30px; border-top:2px solid var(--ink); }
  .job { padding:16px 0 15px; border-bottom:1px solid color-mix(in srgb, var(--ink) 28%, transparent); }
  .job b { display:block; font-family:var(--body-font); font-size:32px; font-weight:700; letter-spacing:-.02em; line-height:1.3; }
  .job span { display:block; font-size:22px; font-weight:600; color:var(--sub); margin-top:4px; }
  .more { font-size:22px; font-weight:700; margin-top:12px; color:var(--sub); }
  .foot { margin-top:auto; padding:18px 76px 46px; display:flex; justify-content:space-between; gap:24px; font-size:18px;
          line-height:1.4; color:var(--sub); }
  .foot .pg { white-space:nowrap; letter-spacing:.12em; font-weight:700; color:var(--ink); }

  /* 표지 · 끝 */
  .tiles { margin:28px 76px 0; display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; }
  .tile { height:200px; background-size:cover; background-position:center; position:relative; overflow:hidden; }
  .tile img { position:absolute; inset:12px; width:calc(100% - 24px); height:calc(100% - 24px); object-fit:contain; }
  .tile em { position:absolute; left:10px; bottom:8px; font-style:normal; font-size:19px; font-weight:800; color:#fff;
             text-shadow:0 1px 3px rgba(0,0,0,.6); }
  h1 { font-family:'NanumMyeongjo',serif; font-weight:700; font-size:118px; line-height:1.1; letter-spacing:-.045em; margin-top:46px; }
  h2 { font-family:'NanumMyeongjo',serif; font-weight:700; font-size:84px; line-height:1.14; letter-spacing:-.04em; margin-top:46px; }
  .sub { font-size:30px; font-weight:600; margin-top:22px; opacity:.85; }
  .idx { margin-top:34px; border-top:2px solid var(--ink); }
  .idx div { display:grid; grid-template-columns:30px 200px 1fr 70px; gap:18px; align-items:center; padding:13px 0;
             border-bottom:1px solid rgba(255,255,255,.22); font-size:24px; }
  .idx i { width:30px; height:30px; display:block; }
  .idx b { font-size:28px; font-weight:800; }
  .idx span { opacity:.8; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .idx small { text-align:right; font-weight:800; font-size:24px; }
  .end li { list-style:none; font-size:28px; font-weight:600; margin-top:12px; opacity:.9; }
  .end li::before { content:'— '; opacity:.6; }
</style>
</head>
<body>
<div id="root"></div>
<script>
function mast(sheet, left, right) {
  const m = el('div', 'mast'); m.append(el('b', '', 'devjobseeker'), el('span', '', right)); sheet.append(m, el('div', 'rule'));
}
function draw(sheet, S, D) {
  const pg = pad2(D.page) + ' / ' + pad2(D.total);
  if (S.type === 'company') {
    const L = S.look;
    Object.entries({ '--bg': L.bg, '--ink': L.ink, '--sub': L.sub, '--accent': L.accent,
                     '--brand-font': S.font, '--body-font': S.body_font }).forEach(([k, v]) => sheet.style.setProperty(k, v));
    mast(sheet, '', D.series);
    if (L.mode === 'band') {
      // 가로 사진은 판 폭에 맞춘 높이 그대로(늘리지 않는다) — 단, 판의 40% 를 넘지 않게
      const h = Math.min(540, Math.round(D.size[0] / S.img_ratio));
      const band = el('div', 'band'); band.style.setProperty('--band-h', h + 'px'); band.style.backgroundImage = `url("${S.image}")`;
      sheet.append(band);
    } else {
      const ob = el('div', 'object'); ob.style.setProperty('--obj-h', '470px');
      const img = el('img'); img.src = S.image; ob.append(img); sheet.append(ob);
    }
    const body = el('div', 'pad');
    const who = el('div', 'who'); who.append(el('span', 'wm', S.wordmark), el('i'), el('span', 'ab body', S.total_jobs + '건 모집중'));
    body.append(who, lines(el('div', 'quote fit'), S.slogan));
    const jobs = el('div', 'jobs');
    S.jobs.forEach(j => { const r = el('div', 'job'); r.append(el('b', 'body', j.title), el('span', 'body', j.meta)); jobs.append(r); });
    body.append(jobs);
    if (S.more) body.append(el('div', 'more body', `외 ${S.more}건 더`));
    sheet.append(body);
    const foot = el('div', 'foot'); foot.append(el('div', 'body', S.credit + ' · ' + S.note), el('div', 'pg', pg));
    sheet.append(foot);
    return;
  }
  // 표지 · 끝 — 무채색 바탕, 색은 회사들 몫
  Object.entries({ '--bg': '#0e0e10', '--ink': '#ffffff', '--sub': '#b8b8be' }).forEach(([k, v]) => sheet.style.setProperty(k, v));
  mast(sheet, '', S.type === 'cover' ? S.kicker : D.series);
  const body = el('div', 'pad');
  if (S.type === 'cover') {
    const tiles = el('div', 'tiles');
    S.tiles.forEach(t => { const c = el('div', 'tile'); c.style.background = t.bg;
      if (t.mode === 'band') { c.style.backgroundImage = `url("${t.image}")`; c.style.backgroundSize = 'cover'; }
      else { const im = el('img'); im.src = t.image; c.append(im); }
      c.append(el('em', '', t.name)); tiles.append(c); });
    sheet.append(tiles);
    body.append(lines(el('h1', 'fit'), S.title.join('\n')), el('div', 'sub body', S.sub));
  } else {
    body.append(lines(el('h2', 'fit'), S.title));
  }
  const idx = el('div', 'idx');
  S.index.forEach(r => { const row = el('div'); const chip = el('i'); chip.style.background = r.accent;
    row.append(chip, el('b', 'body', r.name), el('span', 'body', r.top), el('small', '', r.n + '건')); idx.append(row); });
  body.append(idx);
  if (S.lines) { const ul = el('ul', 'end'); S.lines.forEach(l => ul.append(el('li', 'body', l))); body.append(ul); }
  sheet.append(body);
  const foot = el('div', 'foot'); foot.append(el('div', 'body', S.note), el('div', 'pg', pg));
  sheet.append(foot);
}
/*__COMMON__*/
</script>
</body>
</html>
