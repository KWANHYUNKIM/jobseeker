<!-- brand_kakaobank v3 — 카카오뱅크 전용 판. 중심은 서명 아이템 하나: 세로형 체크카드.
     signature: checkcard   머리 오른쪽에 카드 석 장이 지갑에서 꺼낸 듯 겹친다
                            뒤 = 실제 '시크한 블랙' · '반투명 옐로우' 카드 이미지(원본 그대로, 글자 얹지 않음)
                            앞 = '원하는 문구를 새기는 화이트 커스텀 카드' 형식을 우리가 그린 판 — 오른쪽 가장자리 세로 이름 자리에 직무명,
                                 아래 새긴 문구 자리에 경력. B 심볼은 그리지 않는다(로고 규정)
     yellow-cover           머리 바탕 = 가이드 표지 노랑 #FFE300, 굵은 제목 + Regular 목차(보조)
     ending-credit          복리후생 = 검정 #1E1E1E 면 위 크레딧(보조)
     pretendard             가이드·웹 서체. 큰 글자 400, 제목·라벨 700
     checkcard-sans         모집 내용 본문(줄·크레딧)만 파생 서체 — 각인 카드 번호 숫자 + IC 칩 불릿(typefaces/build_checkcard_sans.py) -->
<meta charset="utf-8">
<title>brand_kakaobank</title>
<style>
  /*__FONTS__*/
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#222}
  body{-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word}
  .sheet{width:var(--w);height:var(--h);background:#fff;color:var(--ink);font-family:var(--font);display:flex;flex-direction:column;overflow:hidden;letter-spacing:-.01em}

  /* 머리 — 노랑 표지 + 카드 석 장 */
  header{flex:none;position:relative;background:var(--accent);height:calc(41*var(--u));padding:calc(3*var(--u)) calc(5.2*var(--u)) calc(2.6*var(--u));overflow:hidden}
  .kicker{position:relative;z-index:3;font-size:calc(1.9*var(--u));font-weight:700;display:flex;gap:calc(1.6*var(--u))}
  .kicker span{font-weight:400}
  .cover{position:absolute;z-index:3;left:calc(5.2*var(--u));bottom:calc(2.6*var(--u));width:calc(43*var(--u))}
  .cover h1{font-size:calc(6*var(--u));white-space:nowrap;line-height:1.1;letter-spacing:-.04em;font-weight:700}
  .stack{margin-top:calc(1.2*var(--u));font-size:calc(1.85*var(--u));line-height:1.45}
  .stack b{font-weight:700;margin-right:calc(.8*var(--u))}
  .index{margin-top:calc(1.6*var(--u));padding-top:calc(1*var(--u));border-top:1px solid var(--ink)}
  .index .row{display:grid;grid-template-columns:1fr auto;align-items:baseline;font-size:calc(1.95*var(--u));line-height:1.34}
  .index .row b{font-weight:400;font-variant-numeric:tabular-nums}

  .wallet{position:absolute;z-index:2;right:calc(3.4*var(--u));top:calc(8.8*var(--u));width:calc(46*var(--u));height:calc(44*var(--u))}
  .wallet img,.wallet .plate{position:absolute;width:calc(23.6*var(--u));height:calc(37.5*var(--u));border-radius:calc(1.4*var(--u))}
  .wallet .c1{left:0;top:calc(5*var(--u))}
  .wallet .c2{left:calc(10.4*var(--u));top:calc(2.5*var(--u))}
  .wallet .plate{left:calc(21.2*var(--u));top:0;background:#fff;box-shadow:0 0 0 1px rgba(30,30,30,.12);overflow:hidden}
  .plate .chip{position:absolute;left:calc(9.3*var(--u));top:calc(3.6*var(--u));width:calc(4.8*var(--u));height:calc(5.9*var(--u));border-radius:calc(.7*var(--u));
    background:linear-gradient(145deg,#dcdcdc,#bdbdbd);box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
  .plate .chip::before,.plate .chip::after{content:'';position:absolute;background:rgba(0,0,0,.18)}
  .plate .chip::before{left:0;right:0;top:50%;height:1px}
  .plate .chip::after{top:22%;bottom:22%;left:50%;width:1px}
  .plate .name{position:absolute;right:calc(1.6*var(--u));top:calc(2.6*var(--u));writing-mode:vertical-rl;font-weight:700;font-size:calc(2.2*var(--u));letter-spacing:.06em;white-space:nowrap;color:var(--ink)}
  .plate .phrase{position:absolute;left:calc(1.9*var(--u));right:calc(4.6*var(--u));top:calc(19.4*var(--u));font-weight:700;font-size:calc(3.4*var(--u));line-height:1.12;letter-spacing:-.02em;color:var(--ink)}

  /* 본문 */
  main{flex:1;min-height:0;overflow:hidden;padding:calc(2.4*var(--u)) calc(5.2*var(--u)) calc(1.8*var(--u));display:flex;flex-direction:column;gap:calc(var(--f)*.9)}
  .lab{display:flex;align-items:baseline;justify-content:space-between;font-size:calc(var(--f)*1.05);font-weight:700;line-height:1.3;margin-bottom:calc(var(--f)*.45)}
  .lab i{font-style:normal;font-weight:400;font-variant-numeric:tabular-nums}
  .panel{background:var(--panel);padding:calc(var(--f)*.3) calc(var(--f)*1)}
  .it{font-family:var(--body);font-size:var(--f);font-weight:400;color:var(--text);line-height:var(--body-lh,1.46);letter-spacing:var(--body-ls,0);padding:calc(var(--f)*.42) 0 calc(var(--f)*.42) calc(var(--f)*1.05);text-indent:calc(var(--f)*-1.05)}
  .it::before{content:'•';font-weight:700;font-size:1.12em;display:inline-block;width:calc(var(--f)*1.05);letter-spacing:0;text-indent:0;color:var(--ink)}
  .it + .it{border-top:1px solid var(--light)}
  .pair{display:grid;grid-template-columns:1fr 1fr;column-gap:calc(var(--f)*1.2);align-items:stretch}
  .pair .col{display:flex;flex-direction:column}
  .pair .panel{flex:1}

  /* 복리후생 — 엔딩 크레딧 */
  .dark{flex:none;background:var(--ink);color:#fff;padding:calc(2.2*var(--u)) calc(5.2*var(--u)) calc(2.4*var(--u))}
  .credits h2{text-align:center;font-size:calc(var(--fc)*1.08);font-weight:700;margin-bottom:calc(var(--fc)*.7)}
  .cr{font-family:var(--body);letter-spacing:var(--body-ls,0);display:grid;grid-template-columns:var(--crl) 1fr;column-gap:calc(var(--fc)*1.6);margin-bottom:calc(var(--fc)*.42);font-size:var(--fc);line-height:1.45}
  .cr .k{text-align:right;font-weight:700;white-space:nowrap}
  .cr .v{color:var(--light);font-weight:400}
  .cr .v strong{color:#fff;font-weight:700}
  .foot{margin-top:calc(1.2*var(--u));padding-top:calc(1.4*var(--u));border-top:1px solid var(--gray);display:flex;justify-content:space-between;align-items:flex-end;gap:calc(3*var(--u))}
  .foot .slogan{font-size:calc(2.6*var(--u));font-weight:700;letter-spacing:-.025em}
  .foot .apply{text-align:right;white-space:nowrap}
  .foot .apply span{display:block;font-size:calc(1.8*var(--u));color:var(--gray);font-weight:400}
  .foot .apply b{font-size:calc(2.3*var(--u));font-weight:700}
</style>
<div id="root"></div>
<script id="data" type="application/json">/*__DATA__*/</script>
<script>/*__FRAME_JS__*/</script>
<script>
(async () => {
  const F = await Frame.init();
  const { D, S, el, ui } = F;
  const B = F.brand || {};
  const IMG = D.brand_images || {};
  F.set('panel', ui.panel || '#f7f7f7');
  F.set('light', ui.light_gray || '#cccccc'); F.set('gray', ui.gray || '#a3a3a3');
  F.set('body', ui.body_font || ui.font);   // 모집 내용 본문 서체 — 제목·목차·카드와 따로
  if (ui.body_line_height) F.set('body-lh', ui.body_line_height);
  if (ui.body_letter_spacing) F.set('body-ls', ui.body_letter_spacing);

  const sheet = el('section', 'sheet'); document.getElementById('root').append(sheet);
  const tasks = S.tasks.flatMap(g => g.items);

  let benefitTitle = '', credits = [];
  for (const b of S.benefits) {
    if (!b.label && !credits.length && !benefitTitle) benefitTitle = b.text;
    else credits.push(b);
  }
  const creditCount = credits.filter(c => !/^https?:/.test(c.text)).length;
  const sections = [
    { ko: '주요 업무', en: 'Tasks', items: tasks },
    { ko: '자격 요건', en: 'Requirements', items: S.qualifications },
    { ko: '우대 사항', en: 'Preferred', items: S.preferences },
  ];
  const pad2 = n => String(n).padStart(2, '0');
  const title = D.title || D.role;

  // 머리
  const header = el('header');
  const kicker = el('div', 'kicker'); kicker.append(el('div', '', B.recruit_label || D.company));
  header.append(kicker);

  const wallet = el('div', 'wallet');
  const photo = (name, cls, alt) => { if (!IMG[name]) return null; const i = el('img', cls); i.src = IMG[name]; i.alt = alt; return i; };
  [photo('card_black', 'c1', '카카오뱅크 블랙 체크카드'), photo('card_yellow', 'c2', '카카오뱅크 반투명 옐로우 체크카드')].forEach(x => x && wallet.append(x));
  const plate = el('div', 'plate');
  plate.append(el('div', 'chip'));
  plate.append(el('div', 'name', (title.match(/[A-Za-z][A-Za-z ]+/) || [title])[0].trim().toUpperCase()));
  const phrase = el('div', 'phrase', D.meta.join(' · '));
  plate.append(phrase);
  wallet.append(plate);
  header.append(wallet);

  const cover = el('div', 'cover');
  cover.append(el('h1', '', title));
  const st = el('div', 'stack'); st.append(el('b', '', 'Stack'), D.stack.join(' · ')); cover.append(st);
  const idx = el('div', 'index');
  [...sections.filter(s => s.items.length), ...(creditCount ? [{ ko: benefitTitle || '복리후생', en: 'Benefits', items: { length: creditCount } }] : [])]
    .forEach(s => { const r = el('div', 'row'); r.append(el('span', '', `${s.ko} ${s.en}`), el('b', '', pad2(s.items.length))); idx.append(r); });
  cover.append(idx);
  header.append(cover);
  sheet.append(header);

  const main = el('main'); sheet.append(main);

  const dark = el('section', 'dark');
  const cr = el('div', 'credits');
  if (credits.length) {
    if (benefitTitle) cr.append(el('h2', '', benefitTitle));
    const bold = t => {
      const v = el('div', 'v'); const re = /(연\s?\d[\d,]*만원|\d[\d,]*만원|만\s?\d+년|한달간)/g; let last = 0, m;
      while ((m = re.exec(t))) { v.append(t.slice(last, m.index), el('strong', '', m[0])); last = m.index + m[0].length; }
      v.append(t.slice(last)); return v;
    };
    credits.forEach(c => { const r = el('div', 'cr'); r.append(el('div', 'k', c.label || ''), bold(c.text)); cr.append(r); });
  }
  const foot = el('div', 'foot');
  foot.append(el('div', 'slogan', B.slogan || ''));
  const ap = el('div', 'apply'); foot.append(ap);
  dark.append(cr, foot); sheet.append(dark);

  const probe = el('span', '', credits.map(c => c.label || '').sort((a, b) => b.length - a.length)[0] || '');
  probe.style.cssText = 'position:absolute;visibility:hidden;font-weight:700;white-space:nowrap;font-family:var(--body)';

  const lab = s => { const l = el('div', 'lab'); l.append(el('span', '', `${s.ko} ${s.en}`), el('i', '', pad2(s.items.length))); return l; };
  const block = s => { const d = el('div', 'col'); d.append(lab(s)); const p = el('div', 'panel'); s.items.forEach(x => p.append(el('div', 'it', x))); d.append(p); return d; };

  const build = () => {
    main.replaceChildren();
    main.append(block(sections[0]));
    const pair = el('div', 'pair'); pair.append(block(sections[1]), block(sections[2])); main.append(pair);
  };

  const cands = [];
  for (const r of [0.92, 0.86, 0.8]) cands.push({ r, columns: 2 });
  Frame.fit(F, cands, c => {
    F.set('fc', `calc(var(--f)*${c.r})`);
    const fpx = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--f'));
    sheet.append(probe); probe.style.fontSize = (fpx * c.r) + 'px'; F.set('crl', probe.offsetWidth + 'px'); probe.remove();
    build();
    return main.scrollHeight <= main.clientHeight + 1 && sheet.scrollHeight <= sheet.clientHeight + 1;
  }, { lo: 10, hi: 36 });
})();
</script>
