name: Deploy

# main 에 push 되면 집 서버(self-hosted runner)가 스스로 당겨받아 재배포한다.
# 러너가 GitHub 로 아웃바운드 접속만 하므로 SSH 포트를 외부에 열 필요가 없다.
on:
  push:
    branches: [main]
  workflow_dispatch:

# 배포가 겹치면 컨테이너 기동이 서로 꼬인다. 최신 것만 남기되 진행 중인
# 배포는 끝까지 보낸다(중간에 끊으면 컨테이너가 어정쩡한 상태로 남는다).
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: 서버 배포
    runs-on: [self-hosted, macOS, ARM64]
    # CI 가 실패한 커밋은 배포하지 않는다.
    steps:
      - name: CI 통과 대기
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.sha }}
          check-name: "빌드·타입체크"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 15
          allowed-conclusions: success,skipped

      # 러너 워크스페이스가 아니라 ~/jobseeker 에서 배포한다.
      # 컴포즈가 ./jd-viewer/public 을 라이브 데이터 볼륨으로 마운트하는데,
      # 그 데이터를 갱신하는 크롤러가 ~/jobseeker 에서 돌기 때문이다.
      - name: 배포 실행
        run: ~/jobseeker/deploy/deploy.sh
