name: Deploy

# main 에 push 되면 집 서버(self-hosted runner)가 스스로 당겨받아 재배포한다.
# 러너가 GitHub 로 아웃바운드 접속만 하므로 SSH 포트를 외부에 열 필요가 없다.
on:
  push:
    branches: [main]
    # paths-ignore 를 두지 않는다. 크롤이 만드는 데이터는 git 이 추적하지 않으니
    # (.gitignore) 애초에 푸시에 실려 오지 않고, 정작 public/ 밑에서 추적되는 것은
    # 손으로 쓰는 guide/·reveng/ 다. 이걸 무시하면 브리핑만 담긴 커밋은 배포를
    # 안 깨우고, 서버는 deploy.sh 가 돌 때만 origin/main 을 당기므로 — 뷰어가 읽는
    # 볼륨이 서버의 워킹트리다 — 다 써 놓고도 운영에는 영영 안 뜬다.
  workflow_dispatch:

# 배포가 겹치면 컨테이너 기동이 서로 꼬인다. 최신 것만 남기되 진행 중인
# 배포는 끝까지 보낸다(중간에 끊으면 컨테이너가 어정쩡한 상태로 남는다).
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: 서버 배포
    runs-on: [self-hosted, macOS, ARM64]
    # 자기 컴퓨터에서 도는 러너다. 어딘가에서 매달리면 다음 배포까지 막히므로
    # 상한을 둔다.
    timeout-minutes: 30
    steps:
      # 별도의 "CI 통과 대기" 단계를 두지 않는다. 이유가 둘이다.
      #  1. GitHub 호스팅 러너를 못 쓴다(계정 결제 잠김). ubuntu-latest job 은
      #     시작조차 못 하고 실패하므로 기다릴 체크가 성공할 수 없다.
      #  2. 설령 CI 를 self-hosted 로 옮겨도, 러너가 한 대뿐이라 배포 job 이
      #     그 한 자리를 점유한 채 CI 를 기다리면 CI 가 영원히 시작 못 하는
      #     교착이 된다.
      #
      # 타입체크 게이트는 이미 이미지 빌드 안에 있다. Dockerfile 의 build
      # stage 가 `tsc -b && vite build` 를 돌리므로 타입 에러면 빌드가 죽고,
      # deploy.sh 가 거기서 멈춘다. 돌고 있던 컨테이너는 건드려지지 않는다.
      #
      # 러너 워크스페이스가 아니라 ~/jobseeker 에서 배포한다. 컴포즈가
      # ./jd-viewer/public 을 라이브 데이터 볼륨으로 마운트하는데, 그 데이터를
      # 갱신하는 크롤러가 ~/jobseeker 에서 돌기 때문이다.
      - name: 배포 실행
        run: ~/jobseeker/deploy/deploy.sh
