name: Probe runner
on: { workflow_dispatch: {} }
jobs:
  probe:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 5
    steps:
      - name: 서버 환경 조사
        run: |
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH:$HOME/.local/bin:$HOME/.claude/local"
          echo "REPO=${DEPLOY_DIR:-$HOME/jobseeker}"
          echo "--- claude CLI ---"; command -v claude && claude --version || echo "없음"
          echo "--- python3 ---"; command -v python3 && python3 -V || echo "없음"
          echo "--- node ---"; command -v node && node -v || echo "없음"
          echo "--- 서버 클론 ---"; ls -d "${DEPLOY_DIR:-$HOME/jobseeker}/.git" 2>/dev/null || echo "없음"
          echo "--- engine ---"; ls "${DEPLOY_DIR:-$HOME/jobseeker}/engine/validate.py" 2>/dev/null || echo "없음"
          echo "--- ANTHROPIC_API_KEY 존재 ---"; [ -n "${ANTHROPIC_API_KEY:-}" ] && echo yes || echo no
