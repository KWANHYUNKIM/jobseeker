name: Reveng loop

# 역설계 엔진 사이클을 서버에서 한 번 돈다.
#
# 왜 셸 스크립트가 아닌가:
#   이 루프는 "공개 자료를 찾아 읽고, 홍보성인지 진짜 의사결정인지 판단해서
#   글로 재구성하는" 일이다. 그 판단이 일의 전부라 자동화할 수 있는 부분은
#   앞뒤(대상 고르기 · 검증 · 커밋)뿐이다. 그래서 서버에 이미 깔려 있는
#   Claude Code CLI 를 헤드리스로 불러 한 사이클을 시킨다.
#
# 어디서 도는가:
#   러너 워크스페이스가 아니라 **서버가 서빙하는 클론**($DEPLOY_DIR)에서 돈다.
#   컴포즈가 그 경로의 jd-viewer/public 을 데이터 볼륨으로 물고 있어서,
#   여기에 쓴 JSON 이 재빌드 없이 그대로 사이트에 나간다.
#
# 한 번에 한 사이클만 돈다. PROMPT.md 의 규칙이 그렇고, 두 개를 욕심내면
# 커밋이 뒤섞여 무엇이 무엇 때문에 바뀌었는지 못 읽게 된다.

on:
  # 사람이 눌러서 한 사이클. 처음에는 이걸로 확인한다.
  workflow_dispatch:
    inputs:
      cycles:
        description: "이번 실행에서 돌 사이클 수 (1~3)"
        required: false
        default: "1"
        type: string

  # 정기 실행 — 6시간마다. 하루 4사이클.
  # 자주 돌린다고 빨라지지 않는다: 사이클마다 사람이 읽을 글이 쌓이고,
  # 큐가 마르면 후보 조사에 시간이 든다. 바꾸려면 이 줄만 고치면 된다.
  schedule:
    - cron: "0 */6 * * *"

# 사이클이 겹치면 STATE.md 를 서로 덮어쓴다. 진행 중인 것은 끝까지 보낸다.
concurrency:
  group: reveng-loop
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  cycle:
    name: 역설계 사이클
    runs-on: [self-hosted, macOS, ARM64]
    # 자료를 찾아 읽고 쓰는 일이라 한 사이클에 몇 분씩 걸린다.
    timeout-minutes: 45
    steps:
      - name: 사전 점검
        id: pre
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:/opt/homebrew/bin:/usr/local/bin:$PATH"

          REPO="${DEPLOY_DIR:-$HOME/jobseeker}"
          [ -d "$REPO/.git" ] || { echo "::error::서버 클론이 없다: $REPO"; exit 1; }
          [ -f "$REPO/engine/validate.py" ] || { echo "::error::engine/validate.py 가 없다"; exit 1; }

          command -v claude >/dev/null || {
            echo "::error::claude CLI 를 찾지 못했다. 서버에서 'npm i -g @anthropic-ai/claude-code' 로 설치하고 한 번 로그인해 둘 것"
            exit 1
          }
          echo "claude $(claude --version)"
          echo "repo=$REPO" >> "$GITHUB_OUTPUT"

      - name: 최신으로 맞춘다
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          cd "${{ steps.pre.outputs.repo }}"
          git fetch --prune origin
          git merge --ff-only origin/main || {
            echo "::error::fast-forward 불가 — 서버 클론에 로컬 변경이 남아 있다"
            exit 1
          }
          echo "시작 리비전: $(git rev-parse --short HEAD)"

      - name: 이번 대상 확인
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          cd "${{ steps.pre.outputs.repo }}"
          # 사다리가 무엇을 가리키는지 로그에 남긴다 — 실패했을 때
          # '무엇을 하려다 실패했는지'가 있어야 다음 실행이 헛돌지 않는다.
          PYTHONIOENCODING=utf-8 python3 engine/validate.py --gaps | head -20

      - name: 사이클 실행
        env:
          # 서버 Mac 에 이미 로그인된 자격을 그대로 쓴다(별도 API 키 없음).
          CYCLES: ${{ inputs.cycles || '1' }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:/opt/homebrew/bin:/usr/local/bin:$PATH"
          cd "${{ steps.pre.outputs.repo }}"

          n="${CYCLES:-1}"
          case "$n" in 1|2|3) ;; *) n=1 ;; esac

          for i in $(seq 1 "$n"); do
            echo "── 사이클 $i/$n ──"
            # 비대화형이라 도구 승인을 받을 사람이 없다. 자기 레포·자기 기계에서
            # 자기가 쓴 스킬을 돌리는 것이라 승인을 건너뛴다.
            claude -p "/reveng" \
              --dangerously-skip-permissions \
              --output-format text \
              || { echo "::error::사이클 $i 실패"; exit 1; }
          done

      - name: 검증
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          cd "${{ steps.pre.outputs.repo }}"
          # 검증을 통과하지 못한 결과는 내보내지 않는다.
          PYTHONIOENCODING=utf-8 python3 engine/validate.py

      - name: 결과 밀어넣기
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          cd "${{ steps.pre.outputs.repo }}"

          # 스킬이 이미 커밋했으면 그대로 밀고, 남은 변경이 있으면 함께 담는다.
          if ! git diff --quiet || ! git diff --cached --quiet; then
            summary=$(PYTHONIOENCODING=utf-8 python3 engine/validate.py 2>&1 | tail -1)
            git config user.name  "reveng-loop"
            git config user.email "molba06@naver.com"
            git add -A
            git commit -m "chore(reveng): 서버 사이클 결과" -m "$summary"
          fi

          ahead=$(git rev-list --count origin/main..HEAD)
          if [ "$ahead" -eq 0 ]; then
            echo "새 커밋 없음 — 이번 사이클은 내보낼 것이 없다"
            exit 0
          fi

          echo "새 커밋 $ahead 개를 push 한다"
          git log --oneline "origin/main..HEAD"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main

      - name: 요약
        if: always()
        run: |
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          cd "${{ steps.pre.outputs.repo }}" || exit 0
          {
            echo "### 역설계 사이클 결과"
            echo ""
            echo '```'
            PYTHONIOENCODING=utf-8 python3 engine/validate.py 2>&1 | tail -3
            echo '```'
            echo ""
            echo "리비전: \`$(git rev-parse --short HEAD)\` — $(git log -1 --pretty=%s)"
          } >> "$GITHUB_STEP_SUMMARY"
