# /etc/ssh/sshd_config.d/200-jobseeker.conf 로 복사되는 SSH 강화 설정.
# setup-server.sh --harden 이 설치한다.
#
# 주의: 이 설정을 넣으면 비밀번호 로그인이 완전히 막힌다. 반드시 키 로그인이
# 되는 것을 확인한 뒤에 적용할 것.

# 공개키 인증만 허용
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no

# root 직접 로그인 차단
PermitRootLogin no

# 이 사용자만 SSH 접속 허용
AllowUsers user

# 무차별 대입 표면 축소
MaxAuthTries 3
MaxSessions 5
LoginGraceTime 30

# 죽은 세션 정리 (5분 무응답 x 2회 = 10분 후 종료)
ClientAliveInterval 300
ClientAliveCountMax 2

# 쓰지 않는 기능 차단
AllowAgentForwarding no
X11Forwarding no
PermitEmptyPasswords no
